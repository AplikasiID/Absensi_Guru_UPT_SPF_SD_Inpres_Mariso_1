<style>
/* ===== Animasi ikon menu bawah (halus; mati otomatis kalau HP memilih "kurangi gerakan") ===== */
.bnav .bn-row > * { -webkit-tap-highlight-color: transparent; transition: background-color .28s ease, color .28s ease, transform .15s ease; }
.bnav .bn-row > *:active { transform: scale(.92); }
.bnav .bn-row > .on .ni svg, .bnav .bn-row > [aria-current] .ni svg { animation: ni-pop .55s cubic-bezier(.34,1.56,.64,1) both; }
.bnav .bn-row > .on, .bnav .bn-row > [aria-current] { animation: ni-pill .35s ease-out both; }
.bnav .bn-row > :nth-child(1).on .ni svg { animation-name: ni-hop; animation-duration: .6s; }
.bnav .bn-row > :nth-child(2).on .ni svg path, .bnav .bn-row > :nth-child(2)[aria-current] .ni svg path { transform-box: view-box; transform-origin: 12px 12px; animation: ni-spin .9s cubic-bezier(.22,1,.36,1) both; }
.bnav .bn-row > :nth-child(3).on .ni svg path:first-child, .bnav .bn-row > :nth-child(3)[aria-current] .ni svg path:first-child { stroke-dasharray: 14; animation: ni-draw .6s .1s ease-out both; }
.bnav .bn-row > :nth-child(4).on .ni svg { animation-name: ni-shield; animation-duration: .7s; }
@keyframes ni-pop { 0% { transform: scale(.55); opacity: .4; } 60% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); } }
@keyframes ni-hop { 0% { transform: translateY(6px) scale(.8); } 45% { transform: translateY(-5px) scale(1.12); } 70% { transform: translateY(1px); } 100% { transform: none; } }
@keyframes ni-spin { from { transform: rotate(-300deg); } to { transform: rotate(0); } }
@keyframes ni-draw { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
@keyframes ni-shield { 0% { transform: scale(.6) rotate(-12deg); } 55% { transform: scale(1.15) rotate(6deg); } 100% { transform: none; } }
@keyframes ni-pill { from { opacity: .35; transform: scale(.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bnav .bn-row > *, .bnav .bn-row > * .ni svg, .bnav .bn-row > * .ni svg path { animation: none !important; transition: none !important; } }
</style>

.seg button{min-height:44px;font-size:12px;padding:0 2px}
.kg-card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 8px 20px rgba(30,58,138,.10);margin-bottom:10px}
.kg-h{font-size:15px;font-weight:800}
.kg-lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 2px 6px}
.kg-lbl2{display:flex;align-items:center;justify-content:space-between}.kg-lbl2 em{font-style:normal;font-weight:700}
.kg-in{display:block;width:100%;min-height:44px;padding:11px 12px;font-size:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit;outline:none;margin-bottom:8px}
.kg-lbl+.kg-in{margin-bottom:0}
.kg-in:focus{border-color:var(--blue)}
textarea.kg-in{resize:vertical;min-height:84px}
.kg-chips{display:flex;flex-wrap:wrap;gap:8px}
.kg-chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;font-family:inherit}
.kg-chip.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.kg-bd{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(100,116,139,.18);color:var(--muted)}
.kg-bd.w{background:#fee2e2;color:#b91c1c}
.kg-pick{min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.kg-fn{font-size:12.5px;font-weight:700;color:var(--ink);word-break:break-all;flex:1;min-width:0}
.kg-card .btn{min-height:48px}
.kg-card .btn+.btn{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);margin-top:8px}
.kg-nav{margin-top:12px}.kg-nav button{width:44px;height:44px}
.kg-it{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:10px;box-shadow:0 6px 16px rgba(30,58,138,.08)}
.kg-it.del{opacity:.85}.kg-it.del .kg-ket{text-decoration:line-through;color:var(--muted)}
.kg-r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kg-tgl{font-size:12px;font-weight:700;color:var(--muted)}
.kg-jn{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--info);color:var(--infoink)}
.kg-it{cursor:pointer}.kg-cv{margin-left:auto;font-size:15px;color:var(--muted);transition:transform .2s}.kg-it.buka .kg-cv{transform:rotate(180deg)}
.kg-it:not(.buka) .kg-ket{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}.kg-det{display:none}.kg-it.buka .kg-det{display:block}.kg-it .kg-ft{cursor:default}
.kg-ket{margin:8px 0 6px;font-size:14px;font-weight:600;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.kg-ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kg-ok{font-size:11.5px;font-weight:800;color:#15803d}.kg-kc{font-size:11.5px;font-weight:800;color:var(--muted)}
.kg-ft a{font-size:12.5px;font-weight:800;color:#1d4ed8;min-height:44px;display:inline-flex;align-items:center}
.kg-ac{display:flex;gap:8px;margin-left:auto}
.kg-ac .pj-b{min-height:44px;min-width:64px}
.pj-b.dl{background:#fee2e2;color:#b91c1c}
.sd-pj{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0}
.sd-bk{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.sd-bt{flex:1;min-width:0}.sd-bt b{display:block;font-size:13.5px;word-break:break-word}.sd-bt span{display:block;font-size:12.5px;font-weight:600;margin-top:2px;word-break:break-word}.sd-bt small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.sd-ac{display:flex;gap:6px;flex-shrink:0}.sd-ac .pj-b{min-height:44px;display:inline-flex;align-items:center}
.std-form{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.sd-ft{font-size:13px;font-weight:800;margin-bottom:8px}.sd-atau{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.std-form .btn{min-height:48px;margin-top:10px}
.sd-hint{font-size:12px;font-weight:600;color:var(--muted);margin-top:8px}
@media (prefers-color-scheme: dark){.kg-chip.on{background:#3b6cf0;border-color:#3b6cf0}.kg-bd.w{background:rgba(239,68,68,.18);color:#FF8F86}.kg-ok{color:#5EE08A}.kg-ft a{color:#9DB7FF}.pj-b.dl{background:rgba(239,68,68,.18);color:#FF8F86}}
</style>
<style>
.k-sub{font-size:12px;font-weight:700;color:var(--muted);margin:2px 4px 8px}
.k-top{display:flex;gap:8px;margin-bottom:10px}.k-top .btn{margin:0;padding:12px}
.k-sis{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}.k-sis:first-child{border-top:0}
.k-sis b{flex:1;min-width:0;font-size:13.5px;font-weight:700;word-break:break-word}.k-no{width:22px;color:var(--muted);font-size:12px;font-weight:700}
.k-sb{display:flex;gap:5px}.k-sb button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:800;font-size:13px;font-family:inherit}
.k-sb button.on[data-s="S"]{background:#fef3c7;border-color:#f59e0b;color:#b45309}.k-sb button.on[data-s="I"]{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.k-sb button.on[data-s="A"]{background:#fee2e2;border-color:#ef4444;color:#b91c1c}.k-sb button.on[data-s="T"]{background:#ede9fe;border-color:#8b5cf6;color:#6d28d9}
.k-st{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}.k-st.S{background:#fef3c7;color:#b45309}.k-st.I{background:#dbeafe;color:#1d4ed8}.k-st.A{background:#fee2e2;color:#b91c1c}.k-st.T{background:#ede9fe;color:#6d28d9}.k-st.H{background:#dcfce7;color:#15803d}
.k-ring{display:flex;gap:6px;margin:0 0 10px}.k-ring div{flex:1;background:var(--card);border-radius:14px;padding:8px 2px;text-align:center;box-shadow:0 4px 12px rgba(30,58,138,.08)}.k-ring b{display:block;font-size:18px;font-weight:800}.k-ring small{font-size:10.5px;font-weight:700;color:var(--muted)}
.k-jam{display:flex;flex-wrap:wrap;gap:6px}.k-jam button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-family:inherit}.k-jam button.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.k-info{background:var(--info);color:var(--infoink);border-radius:14px;padding:11px 13px;font-size:12.5px;font-weight:600;line-height:1.45;margin-bottom:10px}
.k-fo{display:flex;align-items:center;gap:8px;margin-top:6px}.k-fo span{flex:1;min-width:0;font-size:12.5px;font-weight:700;word-break:break-all}
.k-dt{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:6px;margin-bottom:10px;box-shadow:0 6px 16px rgba(30,58,138,.08)}.k-dt b{flex:1;text-align:center;font-size:14px;font-weight:800}.k-dt button{width:44px;height:40px;border:0;background:transparent;color:var(--ink);border-radius:12px}.k-dt button:disabled{opacity:.3}.k-dt svg{width:20px;height:20px}
@media (prefers-color-scheme: dark){.k-sb button.on[data-s="S"]{background:rgba(245,158,11,.2);color:#FBBF4D}.k-sb button.on[data-s="I"]{background:rgba(59,130,246,.22);color:#BFD3FF}.k-sb button.on[data-s="A"]{background:rgba(239,68,68,.2);color:#FF8F86}.k-sb button.on[data-s="T"]{background:rgba(139,92,246,.22);color:#D4C4FF}.k-jam button.on{background:#3b6cf0;border-color:#3b6cf0}}
.bnav .bn-row > :nth-child(4).on .ni svg{animation-name:ni-hop;animation-duration:.6s}
</style>
<style>
/* ===== Siswa (data lengkap) + tombol H dan WA di Absen Siswa ===== */
.k-sb{gap:4px}.k-sb button{width:34px}
.k-sb button.on[data-s="H"]{background:#dcfce7;border-color:#22c55e;color:#15803d}
.k-wa{width:42px;height:42px;border-radius:13px;border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#25D366;color:#fff;box-shadow:0 4px 10px rgba(37,211,102,.35)}
.k-wa svg{width:22px;height:22px}.k-wa:disabled{background:rgba(100,116,139,.18);color:rgba(100,116,139,.55);box-shadow:none}
.k-sis{gap:6px;padding:9px 10px}.k-sis small.nh{display:block;font-size:11px;font-weight:700;color:#b45309;margin-top:1px}
.k-nm{flex:1;min-width:0}.k-nm b{display:block;font-size:13.5px;font-weight:700;word-break:break-word}
.wa-sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:90}.wa-sh.on{display:flex}
.wa-sp{width:100%;max-width:440px;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.wa-sp h3{margin:0 0 2px;font-size:15px}.wa-to{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}
.wa-msg{width:100%;min-height:170px;border:1px solid var(--line);border-radius:14px;padding:12px;font:13.5px/1.5 inherit;background:#dcf8c6;color:#111;resize:vertical}
.btn.wab{background:#25D366;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(37,211,102,.35)}
.btn.sw-add{margin:0 0 10px;border:2px dashed #22c55e;background:#ecfdf5;color:#166534;box-shadow:none}
.btn.sw-alt{margin:0 0 10px;background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.sw-jk{display:flex;gap:8px}.sw-jk button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px}
.sw-jk button.on[data-j="L"]{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}.sw-jk button.on[data-j="P"]{background:#fce7f3;border-color:#ec4899;color:#be185d}
.sw-r{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}.sw-r:first-child{border-top:0}
.sw-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;background:rgba(100,116,139,.2);color:var(--muted)}
.sw-av.L{background:#dbeafe;color:#1d4ed8}.sw-av.P{background:#fce7f3;color:#be185d}
.sw-tx{flex:1;min-width:0}.sw-tx b{display:block;font-size:14px;font-weight:700;word-break:break-word}.sw-tx small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;word-break:break-word}
.sw-tg{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:4px;background:#fef3c7;color:#b45309}
.sw-r .pj-b{min-width:56px;min-height:40px}
@media (prefers-color-scheme: dark){.k-sb button.on[data-s="H"]{background:rgba(34,197,94,.2);color:#5EE08A}.btn.sw-add{background:rgba(34,197,94,.14);color:#86EFAC}.wa-msg{background:#054640;color:#E9EDEF}.sw-av.L{background:rgba(59,130,246,.22);color:#BFD3FF}.sw-av.P{background:rgba(236,72,153,.22);color:#F9A8D4}.sw-tg,.k-sis small.nh{color:#FBBF4D}.sw-tg{background:rgba(245,158,11,.18)}.sw-jk button.on[data-j="L"]{background:rgba(59,130,246,.22);color:#BFD3FF}.sw-jk button.on[data-j="P"]{background:rgba(236,72,153,.22);color:#F9A8D4}}
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function attr(s) { return esc(s).replace(/"/g, '&quot;'); }
  var FILE_MAKS = 5 * 1024 * 1024;
  var q = {};
  try { location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); } catch (e) { }
  var kode = q.kode || '', dev = q.dev || '';
  if (!dev) { try { dev = localStorage.getItem('absensi_device_id') || ''; } catch (e) { } }
  if (!kode) { try { kode = localStorage.getItem('absensi_guru_terakhir') || ''; } catch (e) { } }
  try { if (localStorage.getItem('absensi_admin_ok') === '1') $('navAdminLink').style.display = ''; } catch (e) { }
  var enc = encodeURIComponent(kode) + '&dev=' + encodeURIComponent(dev);
  $('navRiwayatLink').href = 'riwayat.html?kode=' + enc;
  $('navLaporanLink').href = 'laporan.html?kode=' + enc;
  $('navKelasLink').addEventListener('click', function (e) { e.preventDefault(); });
  (function () { var nav = $('bnav'); function pad() { document.body.style.paddingBottom = (nav.offsetHeight + 36) + 'px'; } pad(); window.addEventListener('resize', pad); if (window.ResizeObserver) new ResizeObserver(pad).observe(nav); })();
  (function () { var b = document.querySelector('.ban'); function h() { document.documentElement.style.setProperty('--banh', b.offsetHeight + 'px'); } h(); window.addEventListener('resize', h); if (window.ResizeObserver) new ResizeObserver(h).observe(b); })();

  var FOTO_MAKS_AWAL = 25 * 1024 * 1024, SISI_MAKS = 1600, KUALITAS = 0.72;
  function adalahFoto(f) { var e = (f.name.split('.').pop() || '').toLowerCase(); return e === 'jpg' || e === 'jpeg' || e === 'png'; }
  function bacaAsli(f, ok, gagal) {
    var rd = new FileReader();
    rd.onload = function () { ok(rd.result, f.name, f.type); };
    rd.onerror = function () { gagal(); };
    rd.readAsDataURL(f);
  }
  function bacaFile(f, ok, gagal) {
    if (!adalahFoto(f)) { bacaAsli(f, ok, gagal); return; }
    var url = null;
    function asli() { if (f.size > FILE_MAKS) { gagal('Foto terlalu besar dan gagal dikecilkan. Coba foto lain.'); } else { bacaAsli(f, ok, gagal); } }
    try {
      url = (window.URL || window.webkitURL).createObjectURL(f);
      var im = new Image();
      im.onload = function () {
        try {
          var w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, SISI_MAKS / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
          var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
          var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch); cx.drawImage(im, 0, 0, cw, ch);
          var d = cv.toDataURL('image/jpeg', KUALITAS);
          try { (window.URL || window.webkitURL).revokeObjectURL(url); } catch (e) { }
          // Pakai hasil kecil hanya bila lebih kecil dari aslinya (atau asli melebihi batas).
          var kecil = Math.round((d.length - 23) * 0.75);
          if (d.indexOf('data:image/jpeg') !== 0 || (kecil >= f.size && f.size <= FILE_MAKS)) { asli(); return; }
          if (kecil > FILE_MAKS) { gagal('Foto terlalu besar. Coba foto lain.'); return; }
          ok(d, f.name.replace(/\.[^.]+$/, '') + '.jpg', 'image/jpeg');
        } catch (e) { asli(); }
      };
      im.onerror = function () { try { (window.URL || window.webkitURL).revokeObjectURL(url); } catch (e) { } asli(); };
      im.src = url;
    } catch (e) { asli(); }
  }
  function pesanGagal(e, def) { var m = (e && e.message) || ''; if (/Fungsi tidak dikenal/.test(m)) return 'Server belum diperbarui (fungsi tidak dikenal). Minta admin memasang Code.gs terbaru di Apps Script.'; if (m && !/^Koneksi gagal|^Respons server/.test(m)) return m; return def; }
  function setSt(el, tipe, teks) { if (!el) return; el.className = (el.className.replace(/\b(ok|err)\b/g, '').replace(/\s+/g, ' ').trim()) + (teks ? ' ' + tipe : ''); el.textContent = teks || ''; }

  function tglLabel(t) { var p = String(t).substring(0, 10).split('-'); return (+p[2]) + ' ' + BULAN[+p[1] - 1].substring(0, 3) + ' ' + p[0]; }
  function tglHari(t) { var p = String(t).split('-'); return HARI[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()]; }
  function geserTgl(t, d) { var p = t.split('-'), x = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + d)); return x.getUTCFullYear() + '-' + ('0' + (x.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + x.getUTCDate()).slice(-2); }
  function geserBulan(b, d) { var p = b.split('-'), y = +p[0], m = +p[1] - 1 + d; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
  var IC_KIRI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  var IC_KANAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  function run(fn, args, ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { if (fail) fail(e); });
    r[fn].apply(r, [kode, dev].concat(args || []));
  }
  var GAGAL = 'Tidak bisa terhubung ke server. Periksa internet, lalu coba lagi.';

  var info = null, tab = 'jur';
  function pilihTab(t) {
    tab = t;
    [['jur', 'segJur', 'paneJur'], ['abs', 'segAbs', 'paneAbs'], ['sis', 'segSis', 'paneSis']].forEach(function (x) {
      $(x[1]).className = x[0] === t ? 'on' : ''; $(x[2]).style.display = x[0] === t ? '' : 'none';
    });
    if (!info) return;
    if (t === 'jur') jurMuat(); else if (t === 'abs') absMuat(); else sisMuat();
    try { window.scrollTo(0, 0); } catch (e) { }
  }
  $('segJur').onclick = function () { pilihTab('jur'); };
  $('segAbs').onclick = function () { pilihTab('abs'); };
  $('segSis').onclick = function () { pilihTab('sis'); };
  (function () {
    var x0 = 0, y0 = 0, t0 = 0, urut = ['jur', 'abs', 'sis'];
    document.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
    document.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if (Date.now() - t0 > 700 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
      if (e.target.closest && e.target.closest('input,textarea,select,.k-jam,.fv,.wa-sh')) return;
      var i = urut.indexOf(tab) + (dx < 0 ? 1 : -1); if (i >= 0 && i < urut.length) pilihTab(urut[i]);
    }, { passive: true });
  })();

  function chipKelas(pilih, id) {
    return '<div class="kg-chips" id="' + id + '" style="margin-bottom:10px">' + info.kelas.map(function (k) {
      return '<button type="button" class="kg-chip' + (k.kelas === pilih ? ' on' : '') + '" data-k="' + attr(k.kelas) + '">' + esc(k.kelas) + (k.saya ? ' \u2605' : '') + '</button>';
    }).join('') + '</div>';
  }
  function kelasAwal() { for (var i = 0; i < info.kelas.length; i++) if (info.kelas[i].saya) return info.kelas[i].kelas; return info.kelas.length ? info.kelas[0].kelas : ''; }
  function kelasSaya() { var a = []; info.kelas.forEach(function (k) { if (k.saya) a.push(k.kelas); }); return a; }

  // ================= JURNAL =================
  var jr = null, jrBulan = '', jrEdit = '', jrFoto = [], jrJam = [], jrCara = '', jrBusy = false, jrBuka = false, jrSeq = 0;
  function jurMuat(bulan) {
    var my = ++jrSeq;
    if (!jr) $('paneJur').innerHTML = '<div class="sk"></div>';
    run('getJurnalGuru', [bulan || jrBulan || ''], function (r) {
      if (my !== jrSeq) return;
      if (!r || !r.ok) { $('paneJur').innerHTML = '<div class="empty">' + esc((r && r.message) || 'Gagal memuat.') + '</div>'; return; }
      jr = r; jrBulan = r.bulan; jurGambar();
    }, function () { if (my === jrSeq) $('paneJur').innerHTML = '<div class="empty">' + GAGAL + '</div>'; });
  }
  function jurForm() {

  });

  // ================= SISWA =================
  var sw = null, swKelas = '', swBusy = false, swSeq = 0, swMode = 'daftar', swEdit = '', swJk = '', swCari = '', swInfo = '';
  function sisMuat(kelas) {
    if (kelas) { swKelas = kelas; swMode = 'daftar'; swEdit = ''; swCari = ''; }
    if (!swKelas) swKelas = kelasAwal();
    if (!swKelas) { $('paneSis').innerHTML = '<div class="empty">Belum ada kelas. Minta kepala sekolah mengatur wali kelas.</div>'; return; }
    var my = ++swSeq; $('paneSis').innerHTML = '<div class="sk"></div>';
    run('getSiswaKelas', [swKelas], function (r) {
      if (my !== swSeq) return;
      if (!r || !r.ok) { $('paneSis').innerHTML = '<div class="empty">' + esc((r && r.message) || 'Gagal memuat.') + '</div>'; return; }
      sw = r; sisGambar();
    }, function () { if (my === swSeq) $('paneSis').innerHTML = '<div class="empty">' + GAGAL + '</div>'; });
  }
  function swLengkap(s) { return !!(s.nisn && s.jk && s.ortu && s.hp); }
  function swKurang(s) { var a = []; if (!s.nisn) a.push('NISN'); if (!s.jk) a.push('L/P'); if (!s.ortu) a.push('orang tua'); if (!s.hp) a.push('No. HP'); return a; }
  function swRing() {
    var L = 0, P = 0, K = 0; sw.siswa.forEach(function (s) { if (s.jk === 'L') L++; else if (s.jk === 'P') P++; if (swLengkap(s)) K++; });
    var pc = sw.siswa.length ? Math.round(K * 100 / sw.siswa.length) : 0;
    return '<div class="k-ring"><div><b>' + sw.siswa.length + '</b><small>Siswa</small></div><div><b style="color:#1d4ed8">' + L + '</b><small>Laki-laki</small></div><div><b style="color:#be185d">' + P + '</b><small>Perempuan</small></div><div><b style="color:#15803d">' + pc + '%</b><small>Data lengkap</small></div></div><div class="pj-bar" style="margin:-2px 2px 12px"><i style="width:' + pc + '%"></i></div>';
  }
  function swList() {
    var q = swCari.toLowerCase(), L = sw.siswa.filter(function (s) { return !q || s.nama.toLowerCase().indexOf(q) >= 0 || String(s.nisn || '').indexOf(q) >= 0; });
    if (!sw.siswa.length) return '<div class="empty">Belum ada siswa. Ketuk <b>+ Tambah Siswa</b> atau tempel banyak nama sekaligus.</div>';
    if (!L.length) return '<div class="empty">Tidak ada siswa yang cocok.</div>';
    return '<div class="card">' + L.map(function (s, i) {
      var k = swKurang(s), ini = s.nama.split(' ').slice(0, 2).map(function (x) { return x.charAt(0); }).join('').toUpperCase();
      return '<div class="sw-r"><span class="k-no">' + (i + 1) + '</span><span class="sw-av ' + attr(s.jk || '') + '">' + esc(ini) + '</span><div class="sw-tx"><b>' + esc(s.nama) + '</b><small>' + (s.nisn ? 'NISN ' + esc(s.nisn) : 'NISN belum diisi') + (s.ortu ? ' \u00B7 ' + esc(s.ortu) : '') + '</small>' + (k.length ? '<span class="sw-tg">Belum: ' + k.join(', ') + '</span>' : '') + '</div><button type="button" class="pj-b ub" data-a="ubah" data-i="' + attr(s.id) + '">Ubah</button></div>';
    }).join('') + '</div><div class="sd-hint">Ketuk <b>Ubah</b> untuk melengkapi data. Siswa yang dihapus tidak ikut absen lagi, riwayat lamanya tetap aman.</div>';
  }
  function swForm() {
    var s = { nama: '', nisn: '', ortu: '', hp: '', jk: '' };
    if (swEdit) sw.siswa.forEach(function (x) { if (x.id === swEdit) s = x; });
    swJk = s.jk || '';
    return '<div class="kg-card"><div class="kg-h">' + (swEdit ? 'Ubah Data Siswa' : 'Tambah Siswa') + '</div>' +
      '<label class="kg-lbl kg-lbl2" for="swNama">Nama lengkap *<em id="swCn">0/60</em></label><input class="kg-in" id="swNama" maxlength="60" value="' + attr(s.nama) + '" placeholder="Contoh: Ahmad Fauzi">' +
      '<span class="kg-lbl">Jenis kelamin *</span><div class="sw-jk" id="swJk"><button type="button" data-j="L" class="' + (swJk === 'L' ? 'on' : '') + '">Laki-laki</button><button type="button" data-j="P" class="' + (swJk === 'P' ? 'on' : '') + '">Perempuan</button></div>' +
      '<label class="kg-lbl kg-lbl2" for="swNisn">NISN (10 angka)<em id="swCs">0/10</em></label><input class="kg-in" id="swNisn" inputmode="numeric" maxlength="10" value="' + attr(s.nisn) + '" placeholder="0123456789">' +
      '<label class="kg-lbl" for="swOrtu">Nama orang tua / wali</label><input class="kg-in" id="swOrtu" maxlength="60" value="' + attr(s.ortu) + '" placeholder="Contoh: Bapak Saiful">' +
      '<label class="kg-lbl" for="swHp">No. HP / WhatsApp orang tua</label><input class="kg-in" id="swHp" inputmode="tel" value="' + attr(s.hp) + '" placeholder="08xxxxxxxxxx">' +
      '<div class="st" id="swSt"></div><button type="button" class="btn" data-a="simpan">' + (swEdit ? 'Simpan Perubahan' : 'Simpan Siswa') + '</button>' +
      (swEdit ? '<button type="button" class="btn" data-a="hapus" style="background:transparent;color:#b91c1c;box-shadow:none;border:1px solid var(--line);margin-top:8px">Hapus dari daftar</button>' : '') +
      '<button type="button" class="btn" data-a="batal" style="background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);margin-top:8px">Batal</button></div>';
  }
  function swTempel() {
    return '<div class="kg-card"><div class="kg-h">Tempel daftar nama</div><div class="sd-hint">Satu nama per baris. Boleh tempel dari Word/WhatsApp. Nama yang sudah ada dilewati. NISN dan data lain dilengkapi setelahnya.</div>' +
      '<textarea class="kg-in" id="swTeks" rows="10" placeholder="Ahmad Fauzi&#10;Siti Aisyah&#10;..."></textarea><div class="kg-tgl" id="swN" style="margin-top:6px">0 nama</div><div class="st" id="swSt"></div>' +
      '<button type="button" class="btn" data-a="impor">Tambahkan ke Daftar</button><button type="button" class="btn" data-a="batal" style="background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);margin-top:8px">Batal</button></div>';
  }
  function sisGambar() {
    var h = chipKelas(swKelas, 'swKelas') + '<div class="k-sub">Wali kelas: ' + esc(sw.waliNama || 'belum diatur') + ' \u00B7 ' + sw.siswa.length + ' siswa</div>';
    if (!sw.bolehUbah) {
      h += sw.siswa.length ? '<div class="card">' + sw.siswa.map(function (s, i) { return '<div class="k-sis"><span class="k-no">' + (i + 1) + '</span><b>' + esc(s.nama) + '</b></div>'; }).join('') + '</div>' : '<div class="empty">Daftar siswa belum diisi oleh wali kelas.</div>';
      $('paneSis').innerHTML = h + '<div class="sd-hint">Daftar ini hanya bisa diubah oleh wali kelas.</div>'; return;
    }
    if (swInfo) { h += '<div class="st ok">' + esc(swInfo) + '</div>'; swInfo = ''; }
    if (swMode === 'form') h += swForm();
    else if (swMode === 'tempel') h += swTempel();
    else h += swRing() + '<button type="button" class="btn sw-add" data-a="baru">+ Tambah Siswa</button><button type="button" class="btn sw-alt" data-a="tempel">Tempel banyak nama sekaligus</button><input class="kg-in" id="swCari" placeholder="Cari nama atau NISN..." value="' + attr(swCari) + '" style="margin-bottom:10px"><div id="swList">' + swList() + '</div>';
    $('paneSis').innerHTML = h;
    if (swMode === 'form') swHitung();
  }
  function swHitung() { if ($('swCn')) { $('swCn').textContent = $('swNama').value.length + '/60'; $('swCs').textContent = $('swNisn').value.length + '/10'; } }
  $('paneSis').addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'swCari') { swCari = e.target.value; $('swList').innerHTML = swList(); }
    else if (id === 'swNisn') { e.target.value = e.target.value.replace(/\D/g, ''); swHitung(); }
    else if (id === 'swNama') swHitung();
    else if (id === 'swTeks') $('swN').textContent = e.target.value.split(/\r?\n/).filter(function (x) { return x.trim(); }).length + ' nama';
  });
  function swSelesai(r, pesanDef) {
    swBusy = false;
    if (!r || !r.ok) return setSt($('swSt'), 'err', (r && r.message) || pesanDef);
    swInfo = r.message; swMode = 'daftar'; swEdit = ''; ab = null; sisMuat();
  }
  function swGagal(e2) { swBusy = false; setSt($('swSt'), 'err', pesanGagal(e2, GAGAL)); }
  $('paneSis').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.parentNode.id === 'swKelas') return sisMuat(b.getAttribute('data-k'));
    if (b.parentNode.id === 'swJk') { swJk = b.getAttribute('data-j'); var bs = b.parentNode.children; for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-j') === swJk ? 'on' : ''; return; }
    var a = b.getAttribute('data-a'); if (!a || swBusy) return;
    if (a === 'baru') { swEdit = ''; swMode = 'form'; sisGambar(); }
    else if (a === 'ubah') { swEdit = b.getAttribute('data-i'); swMode = 'form'; sisGambar(); }
    else if (a === 'tempel') { swMode = 'tempel'; sisGambar(); }
    else if (a === 'batal') { swMode = 'daftar'; swEdit = ''; sisGambar(); }
    else if (a === 'simpan') {
      var nama = $('swNama').value.trim(), nisn = $('swNisn').value, hp = $('swHp').value.trim();
      if (!nama) return setSt($('swSt'), 'err', 'Nama lengkap wajib diisi.');
      if (!swJk) return setSt($('swSt'), 'err', 'Pilih jenis kelamin.');
      if (nisn && nisn.length !== 10) return setSt($('swSt'), 'err', 'NISN harus 10 angka.');
      if (hp && !/^(\+?62|0)\d{8,13}$/.test(hp.replace(/[\s-]/g, ''))) return setSt($('swSt'), 'err', 'No. HP tidak valid. Contoh: 081234567890');
      swBusy = true; setSt($('swSt'), 'ok', 'Menyimpan...');
      run('simpanSatuSiswa', [swKelas, swEdit, { nama: nama, jk: swJk, nisn: nisn, ortu: $('swOrtu').value.trim(), hp: hp }], function (r) { swSelesai(r, 'Gagal menyimpan.'); }, swGagal);
    } else if (a === 'hapus') {
      if (!confirm('Hapus siswa ini dari daftar? Riwayat absen lamanya tetap aman.')) return;
      swBusy = true; setSt($('swSt'), 'ok', 'Menghapus...');
      run('hapusSiswa', [swKelas, swEdit], function (r) { swSelesai(r, 'Gagal menghapus.'); }, swGagal);
    } else if (a === 'impor') {
      if (!$('swTeks').value.trim()) return setSt($('swSt'), 'err', 'Tempel nama siswa dulu.');
      swBusy = true; setSt($('swSt'), 'ok', 'Menambahkan...');
      run('tambahSiswaMassal', [swKelas, $('swTeks').value], function (r) { swSelesai(r, 'Gagal menambahkan.'); }, swGagal);
    }
  });

  // ================= MULAI =================
  function mulai() {
    if (!kode) { $('paneJur').innerHTML = '<div class="empty">Buka lewat menu Absen dulu, lalu pilih namamu.</div>'; return; }
    run('getKelasGuru', [], function (r) {
      if (!r || !r.ok) { $('paneJur').innerHTML = '<div class="empty">' + esc((r && r.message) || 'Gagal memuat.') + '</div>'; return; }
      info = r; try { $('guruPill').textContent = String(r.nama || '').split(',')[0]; $('guruKelas').textContent = r.jabatan || ''; } catch (e) { }
      var sy = kelasSaya(); $('sub').textContent = sy.length ? 'Wali kelas: ' + sy.join(', ') : 'Jurnal mengajar & lihat daftar siswa';
      if (!info.kelas.length) { $('paneJur').innerHTML = '<div class="empty">Belum ada kelas yang diatur.</div>'; return; }
      var t = (location.hash || '').replace('#', ''); pilihTab(t === 'abs' || t === 'sis' ? t : 'jur');
    }, function (e) { $('paneJur').innerHTML = '<div class="empty">' + esc(pesanGagal(e, GAGAL)) + '</div>'; });
  }
  mulai();
})();
</script>
</body>
</html>
