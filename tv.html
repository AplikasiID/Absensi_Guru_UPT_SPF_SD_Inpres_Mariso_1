<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Kehadiran Guru</title>
<link rel="icon" type="image/png" href="ikon-192.png">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0b1220; --panel: #131c2e; --txt: #f1f5f9; --sub: #94a3b8;
    --hijau: #22c55e; --kuning: #f59e0b; --merah: #ef4444; --biru: #60a5fa;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: Inter, Roboto, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; padding: 1.2vw 1.6vw; gap: 1.2vw; overflow: hidden; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
  .brand img { height: 5.2vw; width: 5.2vw; }
  .brand small { display: block; font-size: 1.1vw; color: var(--sub); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .brand b { font-size: 2.3vw; }
  .jam { text-align: right; }
  .jam .j { font-size: 5vw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .jam .t { font-size: 1.5vw; color: var(--sub); margin-top: .3vw; }

  .ringkas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vw; }
  .box { background: var(--panel); border-radius: 1.2vw; padding: 1vw 1.4vw; border-left: .5vw solid var(--sub); }
  .box b { display: block; font-size: 4vw; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .box span { font-size: 1.3vw; color: var(--sub); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .box.hadir { border-color: var(--hijau); } .box.hadir b { color: var(--hijau); }
  .box.belum { border-color: var(--merah); } .box.belum b { color: var(--merah); }
  .box.terlambat { border-color: var(--kuning); } .box.terlambat b { color: var(--kuning); }
  .box.izin { border-color: var(--biru); } .box.izin b { color: var(--biru); }

  main { flex: 1; min-height: 0; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(21vw, 1fr)); gap: .8vw; }
  .g { display: flex; align-items: center; justify-content: space-between; gap: .8vw;
       background: var(--panel); border-radius: .9vw; padding: .7vw 1vw; border-left: .35vw solid var(--sub); }
  .g .n { font-size: 1.35vw; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g .i { font-size: 1.1vw; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .g .i b { display: block; font-size: 1.2vw; }
  /* banyak guru (>24): rapatkan supaya semuanya muat di layar */
  .padat { grid-template-columns: repeat(auto-fill, minmax(18vw, 1fr)); gap: .6vw; }
  .padat .g { padding-top: .35vw; padding-bottom: .35vw; }
  .padat .g .n { font-size: 1.2vw; } .padat .g .i, .padat .g .i b { font-size: 1vw; }
  .g.hadir { border-color: var(--hijau); } .g.hadir .i b { color: var(--hijau); }
  .g.terlambat { border-color: var(--kuning); } .g.terlambat .i b { color: var(--kuning); }
  .g.belum { border-color: var(--merah); } .g.belum .i b { color: var(--merah); }
  .g.izin { border-color: var(--biru); } .g.izin .i b { color: var(--biru); }

  .pesan { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
           font-size: 3vw; color: var(--sub); font-weight: 700; }
  footer { display: flex; justify-content: space-between; font-size: 1vw; color: var(--sub); }
  #fs, #fs2 { cursor: pointer; background: none; border: 1px solid var(--sub); color: var(--sub); border-radius: .5vw; padding: .2vw .8vw; font-size: 1vw; }

  #pinBox { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1.2vw; z-index: 5; }
  #pinBox h2 { font-size: 2.4vw; margin: 0; }
  #pinBox input { font-size: 2.4vw; padding: .6vw 1.2vw; border-radius: .8vw; border: 2px solid var(--sub); background: var(--panel); color: var(--txt); text-align: center; width: 18vw; }
  #pinBox button { font-size: 1.8vw; padding: .6vw 2vw; border-radius: .8vw; border: 0; background: var(--biru); color: #0b1220; font-weight: 800; cursor: pointer; }
  #pinErr { color: var(--merah); font-size: 1.4vw; min-height: 1.6vw; }

  @media (max-width: 800px) {
    body { padding: 12px; gap: 10px; overflow: auto; }
    .brand img { height: 48px; width: 48px; } .brand b { font-size: 18px; } .brand small { font-size: 10px; }
    .jam .j { font-size: 34px; } .jam .t { font-size: 12px; }
    .ringkas { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .box { padding: 8px 12px; border-radius: 12px; } .box b { font-size: 30px; } .box span { font-size: 11px; }
    .grid { grid-template-columns: 1fr; gap: 6px; }
    .g { padding: 8px 12px; border-radius: 10px; } .g .n { font-size: 15px; } .g .i, .g .i b { font-size: 13px; }
    .pesan { font-size: 20px; } footer, #fs, #fs2 { font-size: 11px; }
    #pinBox h2 { font-size: 20px; } #pinBox input { font-size: 22px; width: 60vw; } #pinBox button { font-size: 16px; } #pinErr { font-size: 13px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="ikon-192.png" alt="">
      <div><small>UPTD SPF SD Inpres Mariso I</small><b>Papan Kehadiran Guru</b></div>
    </div>
    <div class="jam"><div class="j" id="jam">--:--:--</div><div class="t" id="tgl">&nbsp;</div></div>
  </header>

  <section class="ringkas">
    <div class="box belum"><b id="nBelum">0</b><span>Belum Absen</span></div>
    <div class="box hadir"><b id="nHadir">0</b><span>Tepat Waktu</span></div>
    <div class="box terlambat"><b id="nTerlambat">0</b><span>Terlambat</span></div>
    <div class="box izin"><b id="nIzin">0</b><span>Izin / Dinas</span></div>
  </section>

  <main id="isi"><div class="pesan">Memuat data...</div></main>

  <footer>
    <span id="update">&nbsp;</span>
    <span><button id="fs" onclick="layarPenuh()">Layar penuh</button> &nbsp; <button class="fs2" id="fs2" onclick="gantiPin()">Ganti PIN</button></span>
  </footer>

  <div id="pinBox">
    <h2>Masukkan PIN admin</h2>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
    <div id="pinErr"></div>
    <button onclick="simpanPin()">Buka</button>
  </div>

<script>
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var KEY = 'absensi_tv_pin';
  var timer = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    document.getElementById('jam').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('tgl').textContent = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear();
  }
  setInterval(tick, 1000); tick();

  function ambilPin() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function tampilPin(pesan) {
    document.getElementById('pinErr').textContent = pesan || '';
    document.getElementById('pinBox').style.display = 'flex';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
  function simpanPin() {
    var v = document.getElementById('pinInput').value.trim();
    if (!v) return;
    try { localStorage.setItem(KEY, v); } catch (e) { }
    document.getElementById('pinBox').style.display = 'none';
    muat();
  }
  function gantiPin() { try { localStorage.removeItem(KEY); } catch (e) { } tampilPin(''); }
  document.getElementById('pinInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') simpanPin(); });
  function layarPenuh() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var URUTAN = { belum: 0, terlambat: 1, hadir: 2, izin: 3 };

  function render(data) {
    var isi = document.getElementById('isi');
    if (!data.hariKerja) {
      ['nHadir', 'nBelum', 'nTerlambat', 'nIzin'].forEach(function (id) { document.getElementById(id).textContent = '-'; });
      isi.innerHTML = '<div class="pesan">' + esc(data.alasanLibur || 'Hari ini tidak ada absensi') + '</div>';
      return;
    }
    var h = 0, b = 0, t = 0, iz = 0;
    data.guru.forEach(function (g) {
      if (g.status === 'belum') b++; else if (g.status === 'izin') iz++;
      else { h++; if (g.status === 'terlambat') t++; }
    });
    document.getElementById('nHadir').textContent = h - t; // tepat waktu = sudah absen dikurangi yang terlambat
    document.getElementById('nBelum').textContent = b;
    document.getElementById('nTerlambat').textContent = t;
    document.getElementById('nIzin').textContent = iz;

    var urut = data.guru.slice().sort(function (x, y) {
      return (URUTAN[x.status] - URUTAN[y.status]) || x.nama.localeCompare(y.nama);
    });
    isi.innerHTML = '<div class="grid' + (urut.length > 24 ? ' padat' : '') + '">' + urut.map(function (g) {
      var info;
      if (g.status === 'izin') info = '<b>' + esc(g.ket) + '</b>';
      else if (g.status === 'belum') info = '<b>Belum</b>';
      else info = '<b>' + esc(String(g.masuk).substring(0, 5)) + '</b>' +
        (g.keluar ? 'Pulang ' + esc(String(g.keluar).substring(0, 5)) : (g.status === 'terlambat' ? 'Terlambat' : 'Tepat waktu'));
      return '<div class="g ' + g.status + '"><div class="n">' + esc(g.nama) + '</div><div class="i">' + info + '</div></div>';
    }).join('') + '</div>';
  }

  function muat() {
    var pin = ambilPin();
    if (!pin) { tampilPin(''); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          if (res && /PIN/i.test(res.message || '')) { try { localStorage.removeItem(KEY); } catch (e) { } tampilPin('PIN salah, coba lagi.'); return; }
          document.getElementById('update').textContent = 'Gagal memuat: ' + ((res && res.message) || 'tidak diketahui');
          return;
        }
        render(res);
        try { localStorage.setItem('absensi_tv_cache', JSON.stringify(res)); } catch (e) { }
        document.getElementById('update').textContent = 'Data diperbarui ' + res.dibuat + ' · otomatis tiap 1 menit';
      })
      .withFailureHandler(function (err) {
        document.getElementById('update').textContent = 'Gangguan jaringan, mencoba lagi... (' + (err && err.message || '') + ')';
      })
      .getPapanKehadiran(pin);
  }

  // Tampilkan data terakhir yang tersimpan langsung (instan), lalu perbarui dari server.
  try {
    var c = JSON.parse(localStorage.getItem('absensi_tv_cache') || 'null');
    if (c && c.ok && c.tanggal === (function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); })()) {
      render(c);
      document.getElementById('update').textContent = 'Menampilkan data tersimpan (' + c.dibuat + '), memperbarui...';
    }
  } catch (e) { }
  muat();
  setInterval(muat, 60000);
</script>
</body>
</html>
