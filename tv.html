<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Kehadiran Guru</title>
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="api.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0B1530; --panel: #14234A; --txt: #F1F5FF; --sub: #A9B6D6;
    --hijau: #4ADE80; --kuning: #FBBF24; --merah: #FF8A80; --biru: #7DB2FF;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: "Plus Jakarta Sans", Inter, Roboto, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; padding: 1.2vw 1.6vw; gap: 1.2vw; overflow: hidden; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .brand { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
  .brand img { height: 5.2vw; width: 5.2vw; }
  .brand small { display: block; font-size: 1.1vw; color: var(--sub); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .brand b { font-size: 2.3vw; }
  .jam { text-align: right; }
  .jam .j { font-size: 5vw; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .jam .t { font-size: 1.5vw; color: var(--sub); margin-top: .3vw; }

  .ringkas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vw; }
  .box { background: var(--panel); border-radius: 1.4vw; padding: .8vw 1.5vw; }
  .box b { display: block; font-size: 3.4vw; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .box span { font-size: 1.3vw; color: var(--sub); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .box.hadir { background: rgba(74,222,128,.12); } .box.hadir b { color: var(--hijau); }
  .box.belum { background: rgba(255,138,128,.14); } .box.belum b { color: var(--merah); }
  .box.terlambat { background: rgba(251,191,36,.12); } .box.terlambat b { color: var(--kuning); }
  .box.izin { background: rgba(125,178,255,.12); } .box.izin b { color: var(--biru); }
  .box span { color: #C7D2EE; }

  /* Empat kolom lurus di bawah empat kartu ringkasan (grid & jarak sama persis) */
  main { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vw; align-items: start; }
  .kol { min-width: 0; min-height: 0; max-height: 100%; display: grid; grid-template-columns: 1fr; gap: .5vw; align-content: start; overflow: hidden; }
  .kol.k2 { grid-template-columns: 1fr 1fr; }
  .kol .sub { grid-column: 1 / -1; font-size: .95vw; color: var(--sub); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin: .5vw 0 0; }
  .kol .kosong { grid-column: 1 / -1; color: #475569; font-size: 1.2vw; font-weight: 700; padding: .6vw .2vw; }
  .g { display: flex; align-items: center; justify-content: space-between; gap: .6vw;
       background: var(--panel); border-radius: 1vw; padding: .55vw .9vw; min-width: 0; --c: var(--sub); --t: rgba(169,182,214,.14); }
  .g .av { flex: 0 0 auto; width: 2.7vw; height: 2.7vw; border-radius: 50%; background: var(--t); color: var(--c); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1vw; }
  .g .n { flex: 1; }
  .g .dur { display: flex; align-items: center; gap: .6vw; margin-top: .35vw; }
  .g .dur span { font-size: .95vw; font-weight: 700; color: var(--c); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .g .bar { flex: 1; height: .35vw; border-radius: .2vw; background: rgba(255,255,255,.10); overflow: hidden; }
  .g .bar i { display: block; height: 100%; border-radius: .2vw; background: var(--c); }
  .g .n { font-size: 1.25vw; font-weight: 700; min-width: 0; line-height: 1.15; overflow-wrap: anywhere; }
  .g .i { font-size: .9vw; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.25; }
  .g .i b { display: block; font-size: 1.15vw; }
  .g.belum { --c: var(--merah); --t: rgba(255,138,128,.16); background: #2A1A2E; } .g.belum .i b { color: var(--merah); }
  .g.tunggu .n { color: var(--sub); } .g.tunggu .i b { color: var(--sub); }
  .g.hadir { --c: var(--hijau); --t: rgba(74,222,128,.14); } .g.hadir .i b { color: var(--hijau); }
  .g.terlambat { --c: var(--kuning); --t: rgba(251,191,36,.14); } .g.terlambat .i b { color: var(--kuning); }
  .g.izin { --c: var(--biru); --t: rgba(125,178,255,.14); } .g.izin .i b { color: var(--biru); }
  /* guru yang baru saja absen berkedip */
  @keyframes kedip { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } 50% { box-shadow: 0 0 1.6vw .3vw rgba(34,197,94,.85); } }
  .subb { display: block; font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .95vw; min-height: 1.1vw; }
  .g.baru { animation: kedip 1.2s ease-in-out infinite; }

  /* pengumuman berjalan */
  #ticker { display: none; background: #14234A; border-radius: .9vw; overflow: hidden; white-space: nowrap; padding: .6vw 0; border-left: .4vw solid var(--kuning); }
  #ticker span { display: inline-block; padding-left: 100%; font-size: 1.8vw; font-weight: 700; animation: jalan 30s linear infinite; }
  @keyframes jalan { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  .pesan { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
           font-size: 3vw; color: var(--sub); font-weight: 700; }
  footer { display: flex; justify-content: space-between; font-size: 1vw; color: var(--sub); }
  .ib { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 2.6vw; height: 2.6vw; min-width: 28px; min-height: 28px;
        background: rgba(148,163,184,.12); border: 1px solid #2b3a55; color: var(--sub); border-radius: 50%; padding: 0; margin-left: .6vw; transition: background .15s, color .15s; }
  .ib:hover, .ib:focus-visible { background: rgba(148,163,184,.28); color: var(--txt); outline: none; }
  .ib svg { width: 55%; height: 55%; }

  #pinBox { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1.2vw; z-index: 5; }
  #pinBox h2 { font-size: 2.4vw; margin: 0; }
  #pinBox input { font-size: 2.4vw; padding: .6vw 1.2vw; border-radius: .8vw; border: 2px solid var(--sub); background: var(--panel); color: var(--txt); text-align: center; width: 18vw; }
  #pinBox button { font-size: 1.8vw; padding: .6vw 2vw; border-radius: .8vw; border: 0; background: var(--biru); color: #0b1220; font-weight: 800; cursor: pointer; }
  #pinErr { color: var(--merah); font-size: 1.4vw; min-height: 1.6vw; }

  @media (max-width: 800px) {
    html, body { height: auto; min-height: 100%; }
    body { padding: 12px; gap: 10px; overflow: auto; }
    .brand img { height: 48px; width: 48px; } .brand b { font-size: 18px; } .brand small { font-size: 10px; }
    .jam .j { font-size: 34px; } .jam .t { font-size: 12px; }
    .ringkas { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .box { padding: 8px 12px; border-radius: 12px; } .box b { font-size: 30px; } .box span { font-size: 11px; }
    .subb { font-size: 10px; min-height: 12px; }
    /* HP: empat kolom disusun ke bawah (satu lajur penuh), dengan judul tiap bagian */
    main { flex: none; display: block; overflow: visible; }
    .kol { display: flex; flex-direction: column; gap: 6px; max-height: none; overflow: visible; margin-bottom: 14px; }
    .kol:empty { display: none; }
    .kol::before { content: attr(data-judul); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin: 2px 0 2px; }
    .kol .sub { font-size: 11px; margin-top: 6px; }
    .g { padding: 9px 12px; border-radius: 10px; gap: 10px; }
    .g .n { font-size: 15px; overflow-wrap: break-word; } .g .av { width: 34px; height: 34px; font-size: 12px; } .g .bar { height: 4px; } .g .dur { margin-top: 5px; gap: 8px; } .g .dur span { font-size: 12px; }
    .g .i { font-size: 11px; } .g .i b { font-size: 14px; }
    #ticker span { font-size: 15px; } #ticker { padding: 8px 0; border-radius: 10px; }
    .ib { width: 34px; height: 34px; margin-left: 8px; }
    .pesan { font-size: 20px; } footer { font-size: 11px; }
    #pinBox h2 { font-size: 20px; } #pinBox input { font-size: 22px; width: 60vw; } #pinBox button { font-size: 16px; } #pinErr { font-size: 13px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="ikon-192.png" alt="">
      <div><small>UPTD SPF SD Inpres Mariso I</small><b>Papan Kehadiran Guru</b></div>
    </div>
    <div class="jam"><div class="j" id="jam">--:--:--</div><div class="t" id="tgl">&nbsp;</div></div>
  </header>

  <section class="ringkas">
    <div class="box belum"><b id="nBelum">0</b><span>Belum Absen <em id="subBelum" class="subb"></em></span></div>
    <div class="box hadir"><b id="nHadir">0</b><span>Tepat Waktu</span></div>
    <div class="box terlambat"><b id="nTerlambat">0</b><span>Terlambat</span></div>
    <div class="box izin"><b id="nIzin">0</b><span>Izin / Dinas</span></div>
  </section>

  <main id="isi"><div class="pesan">Memuat data...</div></main>

  <div id="ticker"><span id="tickerIsi"></span></div>

  <footer>
    <span id="update">&nbsp;</span>
    <span>
      <button class="ib" id="fs" onclick="layarPenuh()" title="Layar penuh" aria-label="Layar penuh">
        <svg id="icFs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="ib" id="fs2" onclick="gantiPin()" title="Ganti PIN" aria-label="Ganti PIN">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
      </button>
    </span>
  </footer>

  <div id="pinBox">
    <h2>Masukkan PIN admin</h2>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
    <div id="pinErr"></div>
    <button onclick="simpanPin()">Buka</button>
  </div>

<script>
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var KEY = 'absensi_tv_pin';
  var timer = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    document.getElementById('jam').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('tgl').textContent = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear();
  }
  setInterval(tick, 1000); tick();

  function ambilPin() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function tampilPin(pesan) {
    document.getElementById('pinErr').textContent = pesan || '';
    document.getElementById('pinBox').style.display = 'flex';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
  function simpanPin() {
    var v = document.getElementById('pinInput').value.trim();
    if (!v) return;
    try { localStorage.setItem(KEY, v); } catch (e) { }
    document.getElementById('pinBox').style.display = 'none';
    muat();
  }
  function gantiPin() { try { localStorage.removeItem(KEY); } catch (e) { } tampilPin(''); }
  document.getElementById('pinInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') simpanPin(); });
  function layarPenuh() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen();
  }
  // Ikon berubah: perluas (masuk layar penuh) <-> ciutkan (keluar layar penuh)
  document.addEventListener('fullscreenchange', function () {
    document.getElementById('icFs').innerHTML = document.fullscreenElement
      ? '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>'
      : '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
    document.getElementById('fs').title = document.fullscreenElement ? 'Keluar layar penuh' : 'Layar penuh';
  });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var prevStatus = {}, baruSampai = {};

  var KET = { S: 'Sakit', I: 'Izin', A: 'Alpa', DL: 'Dinas Luar', C: 'Cuti' };

  // Total jam kerja = jam pulang dikurangi jam masuk (dihitung sampai detik, ditampilkan jam + menit penuh).
  function detikDari(t) {
    var p = String(t || '').split(':');
    if (p.length < 2) return null;
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10), d = p.length > 2 ? parseInt(p[2], 10) : 0;
    if (isNaN(h) || isNaN(m)) return null;
    return h * 3600 + m * 60 + (isNaN(d) ? 0 : d);
  }
  function teksDurasi(masuk, keluar) {
    var a = detikDari(masuk), b = detikDari(keluar);
    if (a === null || b === null || b <= a) return '';
    var mnt = Math.floor((b - a) / 60);
    return Math.floor(mnt / 60) + ' jam ' + (mnt % 60) + ' mnt';
  }

  function htmlGuru(g) {
    var shiftLabel = g.shift === 'siang' ? 'Siang' : (g.shift === 'pagi' ? 'Pagi' : '');
    var info, kelas = g.status;
    if (g.status === 'izin') info = '<b>' + esc(g.ket) + '</b>' + esc(KET[String(g.ket).toUpperCase()] || '');
    else if (g.status === 'belum') { info = '<b>Belum</b>' + esc(shiftLabel); kelas = g.lewat ? 'belum' : 'tunggu'; }
    else info = '<b>' + esc(String(g.masuk).substring(0, 5)) + '</b>' +
      (g.keluar ? 'Pulang ' + esc(String(g.keluar).substring(0, 5)) : esc(shiftLabel));
    var baru = (baruSampai[g.nama] && Date.now() < baruSampai[g.nama]) ? ' baru' : '';
    var kata = String(g.nama).replace(/[,.].*$/, '').trim().split(/\s+/);
    var ini = ((kata[0] || '?').charAt(0) + (kata.length > 1 ? kata[1].charAt(0) : '')).toUpperCase();
    var bar = '';
    if (g.status !== 'izin' && g.status !== 'belum' && g.keluar) {
      var a = detikDari(g.masuk), b = detikDari(g.keluar);
      if (a !== null && b !== null && b > a) bar = '<div class="dur"><span>' + esc(teksDurasi(g.masuk, g.keluar)) + '</span><div class="bar"><i style="width:' + Math.min(100, Math.round((b - a) / 28800 * 100)) + '%"></i></div></div>';
    }
    return '<div class="g ' + kelas + baru + '"><div class="av">' + esc(ini) + '</div><div class="n">' + esc(g.nama) + bar + '</div><div class="i">' + info + '</div></div>';
  }

  // Kolom kosong tidak menampilkan tulisan apa pun (tetap menempati lajurnya supaya
  // kolom lain tetap lurus di bawah kartu masing-masing).
  function htmlKolom(daftar, judul) {
    return '<div class="kol" data-judul="' + esc(judul + ' (' + daftar.length + ')') + '">' + daftar.map(htmlGuru).join('') + '</div>';
  }

  function pasangTicker(daftar) {
    var t = document.getElementById('ticker');
    if (!daftar || !daftar.length) { t.style.display = 'none'; return; }
    var teks = daftar.join('   \u2022   ');
    var el = document.getElementById('tickerIsi');
    if (el.textContent !== teks) el.textContent = teks;
    t.style.display = 'block';
    // Kecepatan tetap (bukan tergantung panjang teks): TICKER_VW_PER_DETIK = lebar layar per detik.
    // Makin kecil angkanya makin lambat. 2.2 = sekitar 42 px/detik di layar 1920 px.
    var TICKER_VW_PER_DETIK = 2.2;
    var detik = Math.max(25, Math.round(el.scrollWidth / (window.innerWidth * TICKER_VW_PER_DETIK / 100)));
    if (el.style.animationDuration !== detik + 's') el.style.animationDuration = detik + 's';
  }

  function render(data) {
    var isi = document.getElementById('isi');
    pasangTicker(data.pengumuman);
    if (!data.hariKerja) {
      ['nHadir', 'nBelum', 'nTerlambat', 'nIzin'].forEach(function (id) { document.getElementById(id).textContent = '-'; });
      document.getElementById('subBelum').textContent = '';
      isi.innerHTML = '<div class="pesan">' + esc(data.alasanLibur || 'Hari ini tidak ada absensi') + '</div>';
      return;
    }
    // tandai yang baru saja absen (dari belum -> sudah) supaya berkedip 60 detik
    data.guru.forEach(function (g) {
      var before = prevStatus[g.nama];
      if (before === 'belum' && (g.status === 'hadir' || g.status === 'terlambat')) baruSampai[g.nama] = Date.now() + 60000;
      prevStatus[g.nama] = g.status;
    });

    var h = 0, bMerah = 0, bTunggu = 0, t = 0, iz = 0;
    data.guru.forEach(function (g) {
      if (g.status === 'belum') { if (g.lewat) bMerah++; else bTunggu++; }
      else if (g.status === 'izin') iz++;
      else { h++; if (g.status === 'terlambat') t++; }
    });
    document.getElementById('nBelum').textContent = bMerah + bTunggu; // semua yang belum absen
    document.getElementById('subBelum').textContent = bMerah ? bMerah + ' sudah lewat batas masuk' : (bTunggu ? 'belum ada yang lewat batas masuk' : '');
    document.getElementById('nHadir').textContent = h - t; // tepat waktu
    document.getElementById('nTerlambat').textContent = t;
    document.getElementById('nIzin').textContent = iz;

    var urutNama = function (x, y) { return x.nama.localeCompare(y.nama); };
    var urutBaru = function (x, y) { return String(y.masuk).localeCompare(String(x.masuk)) || urutNama(x, y); }; // yang terbaru absen di atas
    var G = data.guru;
    var belumMerah = G.filter(function (g) { return g.status === 'belum' && g.lewat; }).sort(urutNama);
    var belumTunggu = G.filter(function (g) { return g.status === 'belum' && !g.lewat; }).sort(urutNama);
    var tepat = G.filter(function (g) { return g.status === 'hadir'; }).sort(urutBaru);
    var telat = G.filter(function (g) { return g.status === 'terlambat'; }).sort(urutBaru);
    var izinList = G.filter(function (g) { return g.status === 'izin'; }).sort(urutNama);

    // Kolom Belum Absen berisi SEMUA yang belum absen: yang sudah lewat batas (merah) di atas,
    // lalu yang belum lewat batas (abu-abu). Judul pemisah hanya muncul kalau keduanya ada.
    var kolBelum = '<div class="kol" data-judul="Belum absen (' + (belumMerah.length + belumTunggu.length) + ')">' +
      belumMerah.map(htmlGuru).join('') +
      ((belumTunggu.length && belumMerah.length) ? '<div class="sub">Belum lewat batas masuk (' + belumTunggu.length + ')</div>' : '') +
      belumTunggu.map(htmlGuru).join('') +
      '</div>';
    isi.innerHTML = kolBelum + htmlKolom(tepat, 'Tepat waktu') + htmlKolom(telat, 'Terlambat') + htmlKolom(izinList, 'Izin / dinas');
    muatkan();
  }

  // Kalau satu kolom lebih tinggi dari layar: (1) kecilkan sedikit, (2) bagi jadi
  // dua lajur, (3) kecilkan lagi sampai muat.
  function muatkan() {
    var isi = document.getElementById('isi');
    isi.style.zoom = 1;
    if (window.matchMedia('(max-width: 800px)').matches) return; // HP: daftar disusun ke bawah, tidak perlu dikecilkan
    var ks = isi.querySelectorAll('.kol');
    function over() {
      for (var i = 0; i < ks.length; i++) if (ks[i].scrollHeight > ks[i].clientHeight + 2) return true;
      return false;
    }
    var z = 1;
    while (over() && z > 0.8) { z -= 0.05; isi.style.zoom = z; }
    if (over()) {
      for (var i = 0; i < ks.length; i++) if (ks[i].scrollHeight > ks[i].clientHeight + 2) ks[i].classList.add('k2');
      while (over() && z > 0.55) { z -= 0.05; isi.style.zoom = z; }
    }
  }

  function muat() {
    var pin = ambilPin();
    if (!pin) { tampilPin(''); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          if (res && /PIN/i.test(res.message || '')) { try { localStorage.removeItem(KEY); } catch (e) { } tampilPin('PIN salah, coba lagi.'); return; }
          document.getElementById('update').textContent = 'Gagal memuat: ' + ((res && res.message) || 'tidak diketahui');
          return;
        }
        render(res);
        try { localStorage.setItem('absensi_tv_cache', JSON.stringify(res)); } catch (e) { }
        document.getElementById('update').textContent = 'Data diperbarui ' + res.dibuat + ' · otomatis tiap 1 menit';
      })
      .withFailureHandler(function (err) {
        document.getElementById('update').textContent = 'Gangguan jaringan, mencoba lagi... (' + (err && err.message || '') + ')';
      })
      .getPapanKehadiran(pin);
  }

  // Tampilkan data terakhir yang tersimpan langsung (instan), lalu perbarui dari server.
  try {
    var c = JSON.parse(localStorage.getItem('absensi_tv_cache') || 'null');
    if (c && c.ok && c.tanggal === (function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); })()) {
      render(c);
      document.getElementById('update').textContent = 'Menampilkan data tersimpan (' + c.dibuat + '), memperbarui...';
    }
  } catch (e) { }
  muat();
  setInterval(muat, 60000);
</script>
</body>
</html>
