<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grafik Absensi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Absensi Guru">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="ikon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg1: #c7d2fe;
      --bg2: #fbcfe8;
      --bg3: #bbf7d0;
      --bg4: #fde68a;
      --bg5: #a5f3fc;
      --glass-bg: rgba(255,255,255,0.80);
      --glass-border: rgba(255,255,255,0.62);
      --glass-shadow: rgba(31,38,135,0.16);
      --modal-bg: rgba(255,255,255,0.82);
      --modal-text-sub: rgba(20,20,24,0.82);
      --modal-glow: 0 1px 4px rgba(255,255,255,0.85);
      --text-main: #1c1c1e;
      --text-sub: rgba(28,28,30,0.55);
      --text-sub-2: rgba(28,28,30,0.45);
      --accent-blue: #0a84ff;
      --accent-blue-2: #5e5ce6;
      --divider: rgba(60,60,67,0.10);
      --input-bg: rgba(118,118,128,0.08);
      --hadir: #248a3d;
      --terlambat: #d70015;
      --izin: #3f5dab;
      --alpa: #a4161a;
      --track-bg: rgba(118,118,128,0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #2e1065;
        --bg2: #500724;
        --bg3: #052e2b;
        --bg4: #422006;
        --bg5: #082f49;
        --glass-bg: rgba(34,34,42,0.88);
        --glass-border: rgba(255,255,255,0.18);
        --glass-shadow: rgba(0,0,0,0.45);
        --modal-bg: rgba(32,32,38,0.85);
        --modal-text-sub: rgba(245,245,250,0.85);
        --modal-glow: 0 1px 4px rgba(0,0,0,0.75);
        --text-main: #f2f2f7;
        --text-sub: rgba(242,242,247,0.6);
        --text-sub-2: rgba(242,242,247,0.42);
        --divider: rgba(255,255,255,0.10);
        --input-bg: rgba(118,118,128,0.24);
        --hadir: #30d158;
        --terlambat: #ff453a;
        --izin: #64d2ff;
        --alpa: #ff6961;
        --track-bg: rgba(118,118,128,0.24);
      }
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, var(--bg1) 0%, transparent 42%),
        radial-gradient(circle at 88% 15%, var(--bg2) 0%, transparent 48%),
        radial-gradient(circle at 30% 95%, var(--bg3) 0%, transparent 50%),
        radial-gradient(circle at 82% 90%, var(--bg4) 0%, transparent 45%),
        radial-gradient(circle at 55% 45%, var(--bg5) 0%, transparent 55%),
        #f2f3f7;
      background-attachment: fixed;
      background-size: 130% 130%;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes bgDrift {
      0%   { background-position: 0% 0%, 100% 0%, 20% 100%, 100% 100%, 50% 50%; }
      100% { background-position: 10% 15%, 85% 20%, 35% 85%, 80% 80%, 60% 40%; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
    body.is-scrolling { animation-play-state: paused; }
    body.is-scrolling .summary-card::before { animation-play-state: paused; }
    @media (prefers-color-scheme: dark) { body { background-color: #0b0b0f; } }

    /* ===== Kerangka halaman: header (topbar + judul + ringkasan)
       diam di atas, hanya daftar kartu per-hari yang bisa discroll ===== */
    .page-shell {
      max-width: 1100px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .sticky-top {
      flex: 0 0 auto;
      padding: 20px 20px 0;
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 8px 20px var(--glass-shadow);
      position: relative;
      z-index: 5;
    }
    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .back-link {
      display: flex; align-items: center; gap: 6px;
      color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 13px;
      padding: 7px 12px 7px 8px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: 0 2px 10px var(--glass-shadow);
    }
    .back-link svg { width: 16px; height: 16px; }
    h1 {
      font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-blue-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .month-picker {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg);
      border-radius: 14px;
      padding: 10px 15px;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text-main);
      box-shadow: 0 2px 10px var(--glass-shadow);
      cursor: pointer;
      border: 1px solid var(--glass-border);
    }
    .month-picker svg { width: 16px; height: 16px; color: var(--accent-blue); }
    .month-picker input[type="month"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none;
    }

    .guru-row {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-sub);
      font-size: 13.5px;
      margin-bottom: 20px;
    }
    .guru-row svg { width: 16px; height: 16px; }
    .guru-row b { color: var(--text-main); font-weight: 700; }

    /* ===== Ringkasan cards ===== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
      transition: gap 0.25s ease, margin-bottom 0.25s ease;
    }
    .summary-card {
      position: relative;
      background: var(--glass-bg);
      border-radius: 18px;
      padding: 16px 10px;
      transition: border-radius 0.25s ease, padding 0.25s ease, transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.35);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .summary-card:active { transform: scale(0.96); }
    .summary-card.active {
      border-color: currentColor;
      box-shadow: 0 8px 24px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.35), 0 0 0 2px currentColor;
    }
    .summary-card.hadir.active { color: var(--hadir); }
    .summary-card.terlambat.active { color: var(--terlambat); }
    .summary-card.izin.active { color: var(--izin); }
    .summary-card.alpa.active { color: var(--alpa); }
    .summary-card::before {
      content: "";
      position: absolute;
      top: -60%; left: -70%;
      width: 55%; height: 220%;
      background: linear-gradient(115deg,
        transparent 0%,
        rgba(255,255,255,0.05) 35%,
        rgba(255,255,255,0.50) 48%,
        rgba(255,255,255,0.10) 60%,
        transparent 100%);
      transform: rotate(6deg);
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    .summary-card::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.70) 0%,
        rgba(255,255,255,0.05) 25%,
        rgba(255,255,255,0) 65%,
        rgba(255,255,255,0.25) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes glassSheen {
      0%, 100% { left: -70%; }
      50% { left: 115%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .summary-card::before { animation: none; }
    }
    .summary-card .num { font-size: 27px; font-weight: 800; line-height: 1.2; transition: font-size 0.25s ease; }
    .summary-card .lbl {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-sub-2); margin-top: 2px;
      transition: font-size 0.25s ease, margin-top 0.25s ease, letter-spacing 0.25s ease;
    }
    /* ==== Mode ringkas: aktif otomatis lewat JS saat daftar kartu di-scroll ==== */
    .summary-grid.compact { gap: 8px; margin-bottom: 14px; }
    .summary-grid.compact .summary-card { border-radius: 14px; padding: 10px 4px; }
    .summary-grid.compact .summary-card .num { font-size: 19px; }
    .summary-grid.compact .summary-card .lbl { font-size: 8.5px; letter-spacing: 0.03em; margin-top: 1px; }
    .summary-card.hadir .num { color: var(--hadir); }
    .summary-card.terlambat .num { color: var(--terlambat); }
    .summary-card.izin .num { color: var(--izin); }
    .summary-card.alpa .num { color: var(--alpa); }

    /* ===== Panel detail (desktop: tabel) ===== */
    .panel {
      position: relative;
      background: var(--glass-bg);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px var(--glass-shadow);
      overflow: hidden;
    }
    .panel::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.60) 0%,
        rgba(255,255,255,0.05) 20%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.20) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .panel-title { padding: 18px 20px 4px; font-weight: 700; font-size: 15px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    thead th {
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-sub-2);
      padding: 10px 20px;
      border-bottom: 1px solid var(--divider);
    }
    tbody td {
      padding: 14px 20px;
      font-size: 13.5px;
      border-bottom: 1px solid var(--divider);
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(10,132,255,0.05); }
    tbody tr:last-child td { border-bottom: none; }
    .cell-jam { display: flex; align-items: center; gap: 6px; }
    .cell-jam svg { width: 14px; height: 14px; flex-shrink: 0; }
    .cell-jam.telat { color: var(--terlambat); font-weight: 700; }
    .cell-note { color: var(--text-sub); font-style: italic; white-space: normal; }
    .dash { color: var(--text-sub-2); }

    .badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.ok { background: rgba(48,209,88,0.16); color: var(--hadir); }
    .badge.late { background: rgba(255,69,58,0.14); color: var(--terlambat); }
    .badge.izin { background: rgba(94,92,230,0.14); color: var(--izin); }
    .badge.alpa { background: rgba(255,69,58,0.16); color: var(--alpa); }
    .tag-daring { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px;
                  font-size: 11px; font-weight: 700; background: rgba(255,159,10,0.16); color: #b96400; }
    @media (prefers-color-scheme: dark) { .tag-daring { color: #ff9f0a; } }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub-2);
      font-size: 13.5px;
    }

    /* ===== Mobile cards (hidden by default, shown under 768px) ===== */
    .mobile-list { display: none; }
    .day-card {
      position: relative;
      background: var(--glass-bg);
      border-radius: 18px;
      padding: 16px 16px 14px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 20px var(--glass-shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    /* Kartu berwarna menurut status */
    .day-card { border-left-width: 5px; }
    .day-card.st-ok { background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(220,252,231,.62)); border-left-color: #22c55e; box-shadow: 0 8px 22px rgba(22,163,74,.13); }
    .day-card.st-late { background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(254,226,226,.68)); border-left-color: #ef4444; box-shadow: 0 8px 22px rgba(239,68,68,.13); }
    .day-card.st-izin { background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(219,234,254,.68)); border-left-color: #3b82f6; box-shadow: 0 8px 22px rgba(59,130,246,.13); }
    .day-card.st-alpa { background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(243,244,246,.8)); border-left-color: #6b7280; box-shadow: 0 8px 22px rgba(107,114,128,.13); }
    @media (prefers-color-scheme: dark) {
      .day-card.st-ok { background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(34,197,94,.20)); box-shadow: none; }
      .day-card.st-late { background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(239,68,68,.22)); box-shadow: none; }
      .day-card.st-izin { background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(59,130,246,.22)); box-shadow: none; }
      .day-card.st-alpa { background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(156,163,175,.18)); box-shadow: none; }
    }
    .day-card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .day-card-date { font-weight: 700; font-size: 15px; }
    .day-card-meta {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-sub);
      margin-bottom: 3px;
    }
    .day-card-meta svg { width: 13px; height: 13px; flex-shrink: 0; }
    .jam-box {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: var(--track-bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px;
    }
    .jam-box div { text-align: center; }
    .jam-box .jl { font-size: 11px; color: var(--text-sub-2); margin-bottom: 2px; }
    .jam-box .jv { font-size: 16px; font-weight: 700; }
    .jam-box .jv.telat { color: var(--terlambat); }
    .note-box {
      background: var(--track-bg); border-radius: 12px; padding: 14px 12px; margin-top: 10px;
      text-align: center; font-size: 13.5px; color: var(--text-main); opacity: 0.85;
    }

    .loading {
      padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 13.5px;
    }

    @media (max-width: 768px) {
      .sticky-top { padding: 14px 14px 0; }
      .scroll-area { padding: 14px 14px 20px; }
      .panel { display: none; }
      .mobile-list { display: block; }
      h1 { font-size: 19px; }
      .topbar { align-items: flex-start; }
      .topbar-left { flex-direction: column; align-items: flex-start; gap: 10px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .summary-grid.compact { grid-template-columns: repeat(4, 1fr); }
    }

    /* ================= MODAL POPUP (error) ================= */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 30, 0.55);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 32px 28px 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -18px rgba(20,20,40,0.35);
      animation: modalPop 0.18s ease-out;
    }
    @keyframes modalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      background: rgba(255,69,58,0.16); color: var(--terlambat);
    }
    .modal-icon svg { width: 30px; height: 30px; }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--text-main); margin: 0 0 8px; text-shadow: var(--modal-glow); }
    .modal-desc { font-size: 13.5px; font-weight: 600; color: var(--modal-text-sub); line-height: 1.5; margin: 0 0 24px; text-shadow: var(--modal-glow); }
    .modal-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-2));
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 18px rgba(10,132,255,0.35);
    }
    .modal-btn svg { width: 16px; height: 16px; }
      /* ===== Footer kaca (tetap di bawah layar) ===== */
    .glass-footer {
      position: static;
      width: fit-content;
      margin: 16px auto 0;
      padding: 7px 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: rgba(29,29,31,0.65);
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 999px;
      box-shadow: 0 8px 24px -10px rgba(50,70,90,0.35),
                  inset 0 1px 0 rgba(255,255,255,0.6);
      pointer-events: none;
    }
    .glass-footer strong { color: rgba(29,29,31,0.85); font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .glass-footer {
        color: rgba(242,242,247,0.65);
        background: rgba(30,30,38,0.94);
        border-color: rgba(255,255,255,0.16);
        box-shadow: 0 8px 24px -10px rgba(0,0,0,0.6),
                    inset 0 1px 0 rgba(255,255,255,0.10);
      }
      .glass-footer strong { color: rgba(242,242,247,0.9); }
    }

    /* ================= DESAIN BARU: identitas SD Inpres Mariso I ================= */
    body { background: #f3f6fb; }
    @media (prefers-color-scheme: dark) { body { background: #0b0b0f; } }
    .sticky-top { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #16a34a 140%); border: 0; border-radius: 0 0 30px 30px; box-shadow: 0 10px 24px rgba(30,58,138,.28); padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 16px; color: #fff; }
    .sticky-top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, #f59e0b, #fde68a, #16a34a); border-radius: 0 0 30px 30px; pointer-events: none; }
    .brand-row { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
    .brand-row img { width: 40px; height: auto; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
    .brand-row small { display: block; font-size: 10px; letter-spacing: .09em; opacity: .85; font-weight: 700; }
    .brand-row b { display: block; font-size: 15px; line-height: 1.15; }
    .back-link { display: none !important; }
    .topbar h1 { color: #fff !important; -webkit-text-fill-color: #fff; background: none !important; margin: 0; }
    .guru-row, .guru-row b { color: #fff !important; }
    .guru-row svg { stroke: #bfdbfe; }
    .summary-card { background: rgba(255,255,255,.96); box-shadow: 0 6px 16px rgba(0,0,0,.14); border-color: transparent; }
    @media (prefers-color-scheme: dark) { .summary-card { background: rgba(30,30,38,.92); } }
    #syncInfo:not(:empty) { display: inline-block; background: #fff; padding: 4px 11px; border-radius: 99px; color: #475569; }
    .scroll-area { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
    .bnav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 416px; background: #fff; border-radius: 24px; box-shadow: 0 8px 24px rgba(30,41,59,.2); display: flex; justify-content: space-around; padding: 8px 6px; z-index: 60; }

    /* Anti-kedip: tinggi header dikunci tetap. Logo TIDAK lagi disembunyikan saat scroll
       (dulu display:none -> tinggi header berubah -> area scroll bergeser -> berkedip). */
    .summary-grid, .summary-grid.compact { gap: 8px !important; margin-bottom: 8px !important; transition: none !important; }
    .summary-grid .summary-card, .summary-grid.compact .summary-card { border-radius: 14px !important; padding: 10px 4px !important; transition: box-shadow .2s ease, transform .15s ease !important; }
    .summary-grid .summary-card .num, .summary-grid.compact .summary-card .num { font-size: 20px !important; transition: none !important; }
    .summary-grid .summary-card .lbl, .summary-grid.compact .summary-card .lbl { font-size: 8.5px !important; letter-spacing: .03em !important; margin-top: 1px !important; transition: none !important; }
    .sticky-top { transform: translateZ(0); }
    .scroll-area { overscroll-behavior-y: contain; overflow-anchor: none; }
    .summary-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px; margin-bottom: 8px; }
    .summary-grid .summary-card { border-radius: 14px; padding: 10px 4px; }
    .summary-grid .summary-card .num { font-size: 20px; }
    .summary-grid .summary-card .lbl { font-size: 8.5px; letter-spacing: .03em; margin-top: 1px; }
    .bnav { flex-direction: column; padding: 8px 6px 5px; }
    .bn-row { display: flex; justify-content: space-around; }
    .bn-row a { flex: 1; }
    .bn-credit { text-align: center; font-size: 9px; font-weight: 600; color: #b0b8c6; margin-top: 3px; letter-spacing: .02em; }
    .scroll-area { padding-bottom: calc(116px + env(safe-area-inset-bottom, 0px)); }

    /* ================= RAPIHKAN RIWAYAT (desain v2) ================= */
    :root {
      --rw-bg:#F3F6FB; --rw-card:#fff; --rw-line:#E6EAF2; --rw-muted:#5B6475; --rw-ink:#14213D;
      --t-ok:#E3F4E8; --i-ok:#176B31; --t-late:#FDE8E6; --i-late:#A61B12;
      --t-izin:#E4EAFA; --i-izin:#28408F; --t-alpa:#EFE6E6; --i-alpa:#7A1A1A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --rw-bg:#0b0b0f; --rw-card:#1c1c24; --rw-line:rgba(255,255,255,.10); --rw-muted:#A8AFBF; --rw-ink:#F2F2F7;
        --t-ok:rgba(48,209,88,.18); --i-ok:#5EE08A; --t-late:rgba(255,69,58,.20); --i-late:#FF8F86;
        --t-izin:rgba(100,130,255,.22); --i-izin:#A9BEFF; --t-alpa:rgba(255,120,120,.16); --i-alpa:#F3A5A5;
      }
    }
    body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Arial, sans-serif; background: var(--rw-bg); color: var(--rw-ink); }
    .sticky-top { background:#1E3A8A; border-radius:0 0 24px 24px; box-shadow:0 8px 20px rgba(30,58,138,.22); padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0; }
    .sticky-top::after { height:4px; background:linear-gradient(90deg,#F59E0B 50%,#16A34A 50%); border-radius:0 0 24px 24px; }
    .brand-row { gap:10px; margin-bottom:16px; }
    .brand-row img { width:38px; }
    .brand-row small { font-size:12px; letter-spacing:0; font-weight:600; opacity:.85; }
    .brand-row b { font-size:15px; font-weight:800; }
    .topbar { align-items:flex-end; flex-wrap:nowrap; margin-bottom:16px; gap:10px; }
    .topbar-left { gap:0; }
    .title-block h1 { font-size:22px; font-weight:800; letter-spacing:-.01em; }
    .title-block .guru-row { margin:4px 0 0; font-size:13px; opacity:.92; }
    .month-picker { min-height:44px; padding:0 14px; border-radius:12px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.45); box-shadow:none; color:#fff; font-size:13.5px; font-weight:700; white-space:nowrap; }
    .month-picker svg { color:#fff; width:18px; height:18px; }
    /* ringkasan: satu kartu, empat angka */
    .summary-grid, .summary-grid.compact { gap:0 !important; margin-bottom:-30px !important; position:relative; z-index:2; background:var(--rw-card); border-radius:16px; box-shadow:0 6px 18px rgba(30,58,138,.18); overflow:hidden; }
    .summary-grid .summary-card, .summary-grid.compact .summary-card { background:transparent !important; box-shadow:none !important; border-radius:0 !important; border:0 !important; border-right:1px solid var(--rw-line) !important; padding:12px 4px 10px !important; }
    .summary-grid .summary-card:last-child { border-right:0 !important; }
    .summary-card::before { display:none; }
    .summary-card::after { content:""; display:block; position:absolute; inset:auto; left:20%; right:20%; bottom:0; top:auto; height:3px; padding:0; border-radius:3px 3px 0 0; background:currentColor; -webkit-mask:none; mask:none; opacity:0; transition:opacity .15s; }
    .summary-card.active::after { opacity:1; }
    .summary-card.hadir.active { background:var(--t-ok) !important; }
    .summary-card.terlambat.active { background:var(--t-late) !important; }
    .summary-card.izin.active { background:var(--t-izin) !important; }
    .summary-card.alpa.active { background:var(--t-alpa) !important; }
    .summary-grid .summary-card .num, .summary-grid.compact .summary-card .num { font-size:24px !important; font-weight:800; line-height:1.1; }
    .summary-grid .summary-card .lbl, .summary-grid.compact .summary-card .lbl { font-size:12.5px !important; font-weight:600; letter-spacing:0 !important; text-transform:none; color:var(--rw-muted); margin-top:3px !important; }
    .summary-card.hadir .num { color:var(--i-ok); } .summary-card.terlambat .num { color:var(--i-late); }
    .summary-card.izin .num { color:var(--i-izin); } .summary-card.alpa .num { color:var(--i-alpa); }
    .summary-card.hadir.active, .summary-card.terlambat.active, .summary-card.izin.active, .summary-card.alpa.active { color:inherit; }
    .summary-card.hadir::after { color:var(--i-ok); } .summary-card.terlambat::after { color:var(--i-late); }
    .summary-card.izin::after { color:var(--i-izin); } .summary-card.alpa::after { color:var(--i-alpa); }
    #syncInfo:not(:empty) { margin-top:10px !important; }
    #syncInfo:empty { min-height:0 !important; margin-top:0 !important; }
    /* daftar per pekan */
    .hint { text-align:center; font-size:12.5px; color:var(--rw-muted); margin:0 0 14px; }
    .wk { margin-top:18px; }
    .hint + .wk { margin-top:0; }
    .wk-head { display:flex; justify-content:space-between; padding:0 4px 8px; font-size:13px; font-weight:700; color:var(--rw-ink); }
    .wk-head span { font-weight:600; color:var(--rw-muted); }
    .wk-card { background:var(--rw-card); border:1px solid var(--rw-line); border-radius:16px; overflow:hidden; }
    .rw { display:flex; align-items:center; gap:14px; padding:12px 14px; border-top:1px solid var(--rw-line); }
    .rw:first-child { border-top:0; }
    .s-ok { --tint:var(--t-ok); --ink:var(--i-ok); } .s-late { --tint:var(--t-late); --ink:var(--i-late); }
    .s-izin { --tint:var(--t-izin); --ink:var(--i-izin); } .s-alpa { --tint:var(--t-alpa); --ink:var(--i-alpa); }
    .rw-date { width:46px; flex:0 0 46px; text-align:center; padding:6px 0; border-radius:12px; background:var(--tint); }
    .rw-d { font-size:20px; font-weight:800; line-height:1.1; color:var(--ink); }
    .rw-h { font-size:12px; font-weight:600; color:var(--rw-muted); }
    .rw-main { flex:1; min-width:0; }
    .rw-time { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
    .s-late .rw-time { color:var(--ink); }
    .s-izin .rw-time, .s-alpa .rw-time { font-weight:600; color:var(--rw-muted); }
    .rw-sub { font-size:12.5px; color:var(--rw-muted); margin-top:2px; }
    .rw-badge { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:99px; background:var(--tint); color:var(--ink); font-size:12px; font-weight:700; white-space:nowrap; }
    .rw-badge svg { width:13px; height:13px; flex:0 0 auto; }
    .tag-daring { margin-left:6px; padding:1px 7px; border-radius:99px; background:#FFF1D6; color:#7A4A00; font-size:11px; font-weight:700; }
    @media (prefers-color-scheme: dark) { .tag-daring { background:rgba(255,159,10,.2); color:#FFB44D; } }
    .empty-box { background:var(--rw-card); border:1px solid var(--rw-line); border-radius:16px; padding:32px 20px; text-align:center; color:var(--rw-muted); font-size:13.5px; }
    .more-btn { display:block; width:100%; min-height:46px; margin-top:16px; border-radius:14px; border:1.5px solid #1E3A8A; background:transparent; color:#1E3A8A; font:700 14px "Plus Jakarta Sans",sans-serif; cursor:pointer; }
    @media (prefers-color-scheme: dark) { .more-btn { border-color:#7FA0FF; color:#9DB7FF; } }
    .loading { color:var(--rw-muted); }
    .topbar { margin-bottom:18px; }
    .title-block .guru-row { display:block; margin:4px 0 0; font-size:13px; line-height:1.35; opacity:.92; }
    .title-block .guru-row b { font-weight:700; }
    .scroll-area { padding-top:48px; }
    #syncInfo { display:none !important; }
    .title-block .guru-row svg { display:inline-block; width:15px; height:15px; vertical-align:-2px; margin-right:6px; }
    /* navigasi bawah */
    .bnav { background:var(--rw-card); border-radius:22px; box-shadow:0 8px 24px rgba(30,41,59,.18); padding:8px 8px 6px; }
    .bn-row { gap:4px; }
    .bnav a { padding:7px 0; font-size:12px; font-weight:700; color:var(--rw-muted); border-radius:14px; }
    .bnav a.on { background:#DBE6FB; color:#1E3A8A; }
    .bnav a .ni { display:flex; justify-content:center; margin-bottom:3px; font-size:0; }
    .bnav a .ni svg { width:22px; height:22px; }
    .bn-credit { font-size:11px; color:var(--rw-muted); }
    @media (prefers-color-scheme: dark) { .bnav a.on { background:#1E3A8A; color:#fff; } }
    @media (min-width: 769px) {
      .page-shell { max-width: 640px; }
      .bnav { max-width: 616px; }
    }

    /* Saat memuat, ringkasan masih kosong -> margin negatif membuat header menyusut & judul tertimpa garis.
       Beri tinggi cadangan supaya header sama persis sebelum/sesudah data muncul. */
    .summary-grid:empty { min-height: 64px; display: block !important; }
    .sticky-top { min-height: 0; flex-shrink: 0; }

    /* Tombol/kartu paling bawah sering tertutup menu bawah: tinggi halaman memakai tinggi layar yang
       BENAR-BENAR terlihat (diukur JS, --appH) dan ada ruang cadangan di akhir daftar (--navh). */
    html, body { height: var(--appH, 100dvh) !important; }
    .page-shell { height: var(--appH, 100dvh) !important; }
    #content::after { content: ""; display: block; height: calc(var(--navh, 100px) + 28px + env(safe-area-inset-bottom, 0px)); }

    /* jam dengan detik: sedikit lebih ringkas supaya muat di layar sempit */
    .rw-time { font-size: 14.5px; letter-spacing: -.01em; white-space: normal; }
    .rw-time .tj { display: inline-block; white-space: nowrap; }
    .rw-badge { flex: 0 0 auto; }
    @media (max-width: 350px) { .rw-time { font-size: 13px; } .rw { gap: 10px; padding: 12px 10px; } .rw-badge { padding: 5px 8px; } }
  
    /* ================= HALAMAN GRAFIK ================= */
    :root {
      --g-ok:#248A3D; --g-late:#D97706; --g-info:#0B5ED7; --g-bad:#C62828;
      --g-tl:#B45309; --g-tok:#1E7A3A; --g-track:#E5EAF3; --g-axis:#CBD3E1; --g-mute:#9AA3B2;
      --g-chipP-bg:#E5EAF3; --g-chipP-fg:#334155; --g-chipS-bg:#334155; --g-chipS-fg:#FFFFFF;

        --g-tl:#FFB44D; --g-tok:#5EE08A; --g-track:rgba(255,255,255,.10); --g-axis:rgba(255,255,255,.22); --g-mute:rgba(255,255,255,.35);
        --g-chipP-bg:rgba(255,255,255,.14); --g-chipP-fg:#E5E7EB; --g-chipS-bg:#E5E7EB; --g-chipS-fg:#111827;
      }

    .summary-card.k-info .num { color:var(--g-info); }
    .summary-card.k-late .num { color:var(--g-tl); }
    .gcard { background:var(--rw-card); border:1px solid var(--rw-line); border-radius:20px; padding:18px; margin-bottom:14px; }
    .gcard h2 { margin:0; font-size:16px; font-weight:800; color:var(--rw-ink); }
    .gcard .gsub { margin:2px 0 0; font-size:12px; font-weight:500; color:var(--rw-muted); }

    .gscroll .gsvg { margin-top:0; }

    .gleg { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:8px; font-size:12px; font-weight:600; color:var(--rw-muted); }
    .gleg > div { display:flex; align-items:center; gap:6px; }
    .gsw { display:inline-block; width:14px; height:8px; border-radius:4px; box-sizing:border-box; }

    .gdot { display:inline-block; width:10px; height:10px; border-radius:5px; }
    .gtick { display:inline-block; width:3px; height:12px; }
    .gchip { display:inline-flex; align-items:center; justify-content:center; width:16px; height:14px; border-radius:4px; font-size:9px; font-weight:800; background:var(--g-chipP-bg); color:var(--g-chipP-fg); }
    .gchip.s { background:var(--g-chipS-bg); color:var(--g-chipS-fg); }
    .b-ok { background:var(--g-ok); } .b-late { background:var(--g-late); } .b-info { background:var(--g-info); } .b-bad { background:var(--g-bad); }
    .gdonut { display:flex; align-items:center; gap:18px; margin-top:14px; }
    .gdonut svg { flex:none; width:132px; height:132px; }
    .gdl { flex:1; display:flex; flex-direction:column; gap:10px; font-size:13px; font-weight:600; color:var(--rw-ink); }
    .gdl div { display:flex; align-items:center; gap:8px; }

    .gdl b { font-weight:800; }
    .gdl i { width:12px; height:12px; border-radius:4px; flex:none; }

    .gb-lbl { width:92px; font-size:13px; font-weight:600; color:var(--rw-ink); }
    .gb-track { flex:1; height:12px; border-radius:6px; background:var(--g-track); overflow:hidden; }
    .gb-fill { height:12px; background:var(--g-ok); }
    .gb-val { width:42px; text-align:right; font-size:13px; font-weight:800; color:var(--rw-ink); }
    svg .tx { fill:var(--rw-muted); font-size:10px; }
    svg .tx-b { font-weight:800; }
    svg .tx-ink { fill:var(--rw-ink); }
    svg .tx-late { fill:var(--g-tl); }
    svg .tx-ok { fill:var(--g-tok); }
    svg .f-ok { fill:var(--g-ok); } svg .f-late { fill:var(--g-late); } svg .f-info { fill:var(--g-info); } svg .f-bad { fill:var(--g-bad); }
    svg .f-mute { fill:var(--g-mute); } svg .f-card { fill:var(--rw-card); fill-opacity:.85; }
    svg .s-ok { stroke:var(--g-ok); } svg .s-late { stroke:var(--g-late); } svg .s-info { stroke:var(--g-info); } svg .s-bad { stroke:var(--g-bad); }
    svg .s-track { stroke:var(--g-track); } svg .s-axis { stroke:var(--g-axis); } svg .s-tl { stroke:var(--g-tl); } svg .s-card { stroke:var(--rw-card); }
    svg .f-chipP { fill:var(--g-chipP-bg); } svg .f-chipS { fill:var(--g-chipS-bg); }
    svg .tx-chipP { fill:var(--g-chipP-fg); font-size:9px; font-weight:800; } svg .tx-chipS { fill:var(--g-chipS-fg); font-size:9px; font-weight:800; }

  <script>
    var WEBAPP_URL = "index.html";
    var MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    var HARI_PENDEK = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    // Cadangan kalau data lama (belum membawa jadwal dari server). Nilai sebenarnya dibaca server dari sheet Pengaturan.
    var JADWAL_DEFAULT = { pagi: { batasMasuk: '07:30', jamPulang: '15:00' }, siang: { batasMasuk: '09:30', jamPulang: '17:00' } };
    var kode, deviceId, bulanAwal;
    var reqSeq = 0, lastResult = null, bulanAktif = '';

    function formatMonthLabel(yyyyMM) {
      var p = yyyyMM.split('-');
      return MONTH_NAMES_ID[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[0], 10);
    }
    function bulanGeser(yyyyMM, delta) {
      var p = yyyyMM.split('-');
      var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    function hhmm(t) {
      if (!t) return null;
      var p = String(t).split(':');
      if (p.length < 2) return null;
      var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
      if (isNaN(h) || isNaN(m)) return null;
      return h * 60 + m;
    }
    function fmtDurasi(m) {
      var j = Math.floor(m / 60), s = Math.round(m - j * 60);
      if (s === 60) { j += 1; s = 0; }
      return j + 'j ' + s + 'm';
    }
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function adaTelat(r) { return !r.ket && (r.status === 'Terlambat' || r.status === 'Sangat Terlambat'); }
    function telatOf(r) { return adaTelat(r) ? (Number(r.telatMenit) || 0) : 0; }
    function labelHari(tanggal) {
      var d = new Date(tanggal + 'T00:00:00');
      return HARI_PENDEK[d.getDay()] + ' ' + d.getDate();
    }

    // ---- Penyimpanan di HP: kunci SAMA dengan halaman Riwayat, jadi data saling dipakai ----
    function cacheKey(bulanTahun) { return 'absensi_riwayat_v1_' + kode + '_' + bulanTahun; }
    function bacaCache(bulanTahun) {
      try { var t = localStorage.getItem(cacheKey(bulanTahun)); return t ? JSON.parse(t) : null; } catch (e) { return null; }
    }
    function simpanCache(bulanTahun, result) {
      try { result._savedAt = Date.now(); localStorage.setItem(cacheKey(bulanTahun), JSON.stringify(result)); } catch (e) { }
    }
    function jamTeks(ms) {
      var d = new Date(ms || Date.now());
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function setSync(teks, merah, bisaUlang) {
      var el = document.getElementById('syncInfo');
      el.style.color = merah ? '#dc2626' : '';
      el.textContent = teks || '';
      if (bisaUlang) {
        var a = document.createElement('a');
        a.href = '#'; a.textContent = ' Coba lagi';
        a.style.cssText = 'color:#2563eb; font-weight:800; text-decoration:none;';
        a.onclick = function (e) { e.preventDefault(); loadData(document.getElementById('monthInput').value); };
        el.appendChild(a);
      }
    }

    document.getElementById('backLink').href = WEBAPP_URL;

    google.script.url.getLocation(function (location) {
      kode = location.parameter.kode;
      deviceId = location.parameter.dev;
      bulanAwal = location.parameter.bulan; // opsional, format yyyy-MM
      init();
    });

    function init() {
      var now = new Date();
      var defaultBulan = bulanAwal || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0'));
      document.getElementById('monthInput').value = defaultBulan;
      document.getElementById('monthLabel').textContent = formatMonthLabel(defaultBulan);
      document.getElementById('monthInput').addEventListener('change', function (e) {
        if (!e.target.value) return;
        document.getElementById('monthLabel').textContent = formatMonthLabel(e.target.value);
        loadData(e.target.value);
      });
      if (!kode) {
        renderError('Nama guru tidak diketahui. Kembali ke halaman absen dan pilih nama terlebih dahulu.');
        return;
      }
      var nr = document.getElementById('navRiwayatLink');
      nr.href = 'riwayat.html?kode=' + encodeURIComponent(kode) + '&dev=' + encodeURIComponent(deviceId || '');
      loadData(defaultBulan);
    }

    function tampilkanHasil(result) {
      if (result.nama) {
        document.getElementById('guruNama').textContent = result.nama;
        document.getElementById('guruRow').style.display = 'block';
      }
      renderData(result);
    }

    // Tampilkan data tersimpan dulu (instan), lalu perbarui dari server.
    function loadData(bulanTahun) {
      var mySeq = ++reqSeq;
      bulanAktif = bulanTahun;
      var cached = bacaCache(bulanTahun);
      if (cached) { tampilkanHasil(cached); setSync('', false); }
      else { document.getElementById('content').innerHTML = '<div class="loading">Memuat grafik...</div>'; setSync('', false); }
      google.script.run
        .withSuccessHandler(function (result) {
          if (mySeq !== reqSeq) return;
          if (!result.ok) {
            if (!cached) { renderError(result.message); return; }
            setSync('Gagal memperbarui: ' + (result.message || 'HP tidak dikenali') + ' (data tersimpan pukul ' + jamTeks(cached._savedAt) + ').', true, true);
            return;
          }
          simpanCache(bulanTahun, result);
          tampilkanHasil(result);
          setSync('', false);
        })
        .withFailureHandler(function (err) {
          if (mySeq !== reqSeq) return;
          if (!cached) { renderError('Terjadi kesalahan: ' + (err && err.message)); return; }
          setSync('Tidak bisa terhubung ke server \u2014 menampilkan data tersimpan pukul ' + jamTeks(cached._savedAt) + '. Mungkin belum lengkap.', true, true);
        })
        .getRiwayatAbsen(kode, deviceId, bulanTahun);
    }

    function renderError(msg) {
      document.getElementById('summaryGrid').innerHTML = '';
      document.getElementById('content').innerHTML = '';
      document.getElementById('errorDesc').textContent = msg;
      document.getElementById('errorBtn').href = WEBAPP_URL;
      document.getElementById('errorOverlay').classList.add('show');
    }

    function summaryCard(cls, num, label) {
      return '<div class="summary-card ' + cls + '"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
    }

    // ================= RENDER =================
    function renderData(result) {
      lastResult = result;
      var r = result.ringkasan || { hadir: 0, terlambat: 0, izin: 0, alpa: 0 };
      var rows = result.rows || [];
      var total = r.hadir + r.izin + r.alpa;
      var box = document.getElementById('content');

      if (!total) {
        document.getElementById('summaryGrid').innerHTML = '';
        box.innerHTML = '<div class="empty-box">Belum ada data absensi untuk bulan ini.</div>';
        return;
      }

      var sd = 0, nd = 0, st = 0, nt = 0;
      rows.forEach(function (row) {
        if (row.ket) return;
        var m = hhmm(row.jamMasuk), p = hhmm(row.jamKeluar);
        if (m !== null && p !== null && p > m) { sd += p - m; nd++; }
        var t = telatOf(row);
        if (t > 0) { st += t; nt++; }
      });
      document.getElementById('summaryGrid').innerHTML =
        summaryCard('k-ok', Math.round(r.hadir / total * 100) + '%', 'Kehadiran') +
        summaryCard('k-info', nd ? fmtDurasi(sd / nd) : '-', 'Durasi kerja') +
        summaryCard('k-late', r.terlambat, 'Terlambat') +
        summaryCard('k-late', nt ? Math.round(st / nt) + ' mnt' : '-', 'Rerata telat');

      // 10 hari terakhir yang ada absen masuknya (urut dari lama ke baru)
      var hari = rows.filter(function (x) { return !x.ket && hhmm(x.jamMasuk) !== null; })
        .sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : (a.tanggal > b.tanggal ? 1 : 0); })
        ;
      var hari10 = hari.slice(-10);

      var html = kartuDonut(r, total);
      if (hari.length) { html += kartuBatang(hari10) + kartuJam(hari, result.jadwal); }
      html += '<div class="gcard" id="cardBanding" style="display:none;"></div>';
      box.innerHTML = html;
      // grafik jam/durasi kerja: tampilkan hari terbaru di bawah, sisanya bisa digeser ke atas
      var gs = box.querySelector('.gscroll');
      if (gs) gs.scrollTop = gs.scrollHeight;
      muatPerbandingan(bulanAktif);
    }

    function kartuDonut(r, total) {
      var tepat = Math.max(0, r.hadir - r.terlambat);
      var segs = [
        { n: tepat, c: 's-ok', b: 'b-ok', l: 'Tepat waktu' },
        { n: r.terlambat, c: 's-late', b: 'b-late', l: 'Terlambat' },
        { n: r.izin, c: 's-info', b: 'b-info', l: 'Izin' },
        { n: r.alpa, c: 's-bad', b: 'b-bad', l: 'Alpa' }
      ];
      var C = 2 * Math.PI * 52, off = 0, arcs = '';
      var aktif = segs.filter(function (s) { return s.n > 0; }).length;
      segs.forEach(function (s) {
        if (s.n <= 0) return;
        var len = s.n / total * C;
        var vis = aktif > 1 ? Math.max(1, len - 2) : len;
        arcs += '<circle cx="66" cy="66" r="52" fill="none" class="' + s.c + '" stroke-width="16" stroke-dasharray="' + vis.toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="-' + off.toFixed(1) + '" transform="rotate(-90 66 66)"/>';
        off += len;
      });
      var pct = Math.round(r.hadir / total * 100);
      var berjalan = (bulanAktif === ymd(new Date()).slice(0, 7));
      var legend = segs.map(function (s) { return '<div><i class="' + s.b + '"></i><span class="gl">' + s.l + '</span><b>' + s.n + '</b></div>'; }).join('');
      return '<div class="gcard"><h2>Kehadiran bulan ini</h2><p class="gsub">' + total + ' hari kerja' + (berjalan ? ' sampai hari ini' : '') + '</p>' +
        '<div class="gdonut"><svg role="img" aria-label="Diagram lingkaran kehadiran: tepat waktu ' + tepat + ', terlambat ' + r.terlambat + ', izin ' + r.izin + ', alpa ' + r.alpa + ' dari ' + total + ' hari kerja" viewBox="0 0 132 132">' +
        '<circle cx="66" cy="66" r="52" fill="none" class="s-track" stroke-width="16"/>' + arcs +
        '<text x="66" y="72" text-anchor="middle" class="tx-ink" style="font-size:26px;font-weight:800">' + pct + '%</text>' +
        '<text x="66" y="88" text-anchor="middle" class="tx" style="font-size:11px;font-weight:600">hadir</text></svg>' +
        '<div class="gdl">' + legend + '</div></div></div>';
    }

    function kartuBatang(rows) {
      var n = rows.length, maxV = 0;
      rows.forEach(function (r) { var t = telatOf(r); if (t > maxV) maxV = t; });
      var step = 15, yMax;
      function hitung() { yMax = Math.max(step, Math.ceil(maxV / step) * step); }
      hitung();
      while (yMax / step > 3) { step += 15; hitung(); }
      var L = 30, R = 316, base = 130, H = 120, scale = H / yMax;
      var slot = (R - L) / n, bw = Math.min(16, slot * 0.6);
      var s = '';
      for (var v = 0; v <= yMax; v += step) {
        var y = base - v * scale;
        s += '<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" class="' + (v === 0 ? 's-axis' : 's-track') + '" stroke-width="1"/>';
        s += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="tx">' + v + '</text>';
      }
      var desk = [];
      rows.forEach(function (r, i) {
        var x = L + slot * i + (slot - bw) / 2, cx = x + bw / 2, t = telatOf(r);
        if (t > 0) {
          var h = Math.max(3, t * scale);
          s += '<rect x="' + x.toFixed(1) + '" y="' + (base - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" class="f-late"/>';
          s += '<text x="' + cx.toFixed(1) + '" y="' + (base - h - 4).toFixed(1) + '" text-anchor="middle" class="tx tx-b tx-late" style="font-size:11px">' + Math.round(t) + '</text>';
          desk.push(r.tanggal.slice(8) + ' ' + Math.round(t) + ' menit');
        } else {
          s += '<rect x="' + x.toFixed(1) + '" y="' + (base - 2) + '" width="' + bw.toFixed(1) + '" height="2" rx="1" class="f-mute"/>';
        }
        s += '<text x="' + cx.toFixed(1) + '" y="' + (base + 18) + '" text-anchor="middle" class="tx">' + parseInt(r.tanggal.slice(8), 10) + '</text>';
      });
      return '<div class="gcard"><h2>Keterlambatan per hari</h2><p class="gsub">Menit setelah batas masuk, ' + n + ' hari kerja terakhir</p>' +
        '<svg class="gsvg" role="img" aria-label="Diagram batang keterlambatan per hari. ' + (desk.length ? 'Terlambat: ' + desk.join(', ') : 'Tidak ada keterlambatan') + '" viewBox="0 0 318 160">' + s + '</svg></div>';
    }

    function kartuJam(rows, jadwal) {
      var jd = jadwal || {};
      function jdw(sh) {
        var key = (sh === 'S') ? 'siang' : 'pagi';
        var j = jd[key] || JADWAL_DEFAULT[key];
        return { batas: hhmm(j.batasMasuk), pulang: hhmm(j.jamPulang) };
      }
      var today = ymd(new Date());
      var items = rows.map(function (r) {
        var j = jdw(r.shift);
        return { r: r, sh: (r.shift === 'S' ? 'S' : (r.shift === 'P' ? 'P' : 'F')), batas: j.batas, pul: j.pulang, m: hhmm(r.jamMasuk), p: hhmm(r.jamKeluar) };
      });
      var lo = 1e9, hi = 0, adaPenuh = false;
      items.forEach(function (it) {
        lo = Math.min(lo, it.m, it.batas);
        hi = Math.max(hi, it.pul, it.m, it.p === null ? 0 : it.p);
        if (it.sh === 'F') adaPenuh = true;
      });
      var aStart = Math.floor((lo - 10) / 30) * 30, aEnd = Math.ceil((hi + 10) / 30) * 30;
      if (aEnd - aStart < 360) aEnd = aStart + 360;
      var X0 = 58, W = 250;
      function X(m) { var v = X0 + (m - aStart) / (aEnd - aStart) * W; return Math.max(X0, Math.min(X0 + W, v)); }
      function f1(v) { return v.toFixed(1); }
      var n = items.length, axisY = 34 + 20 * (n - 1) + 14, s = '';
      var stepT = (aEnd - aStart) <= 480 ? 60 : 120, sumbu = '';
      for (var t = Math.ceil(aStart / stepT) * stepT; t <= aEnd; t += stepT) {
        s += '<line x1="' + f1(X(t)) + '" y1="20" x2="' + f1(X(t)) + '" y2="' + axisY + '" class="s-track" stroke-width="1"/>';
        sumbu += '<text x="' + f1(X(t)) + '" y="14" text-anchor="middle" class="tx">' + ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2) + '</text>';
      }
      s += '<line x1="' + X0 + '" y1="' + axisY + '" x2="' + (X0 + W) + '" y2="' + axisY + '" class="s-axis" stroke-width="1"/>';
      var ket = [];
      items.forEach(function (it, i) {
        var cy = 34 + 20 * i, late = adaTelat(it.r), cls = late ? 'f-late' : 'f-info';
        var chip = (it.sh === 'S') ? 'S' : it.sh;
        s += '<rect x="2" y="' + (cy - 7) + '" width="16" height="14" rx="4" class="' + (it.sh === 'S' ? 'f-chipS' : 'f-chipP') + '"/>' +
             '<text x="10" y="' + (cy + 3.2) + '" text-anchor="middle" class="' + (it.sh === 'S' ? 'tx-chipS' : 'tx-chipP') + '">' + chip + '</text>' +
             '<text x="22" y="' + (cy + 3.5) + '" class="tx">' + labelHari(it.r.tanggal) + '</text>';
        s += '<line x1="' + f1(X(it.batas)) + '" y1="' + (cy - 8) + '" x2="' + f1(X(it.batas)) + '" y2="' + (cy + 8) + '" class="s-tl" stroke-width="2"/>' +
             '<line x1="' + f1(X(it.pul)) + '" y1="' + (cy - 8) + '" x2="' + f1(X(it.pul)) + '" y2="' + (cy + 8) + '" class="s-ok" stroke-width="2"/>';
        var xm = X(it.m);
        if (it.p !== null && it.p > it.m) {
          var xp = X(it.p);
          s += '<rect x="' + f1(xm) + '" y="' + (cy - 5) + '" width="' + f1(Math.max(4, xp - xm)) + '" height="10" rx="5" class="' + cls + '"/>';
          if (it.p < it.pul) {
            s += '<circle cx="' + f1(xp) + '" cy="' + cy + '" r="4.5" class="f-bad s-card" stroke-width="1.5"/>';
            ket.push(labelHari(it.r.tanggal) + ' pulang cepat');
          }
        } else if (it.r.tanggal === today) {
          s += '<circle cx="' + f1(xm) + '" cy="' + cy + '" r="5" class="' + cls + ' s-card" stroke-width="1.5"/>' +
               '<text x="' + f1(xm + 11) + '" y="' + (cy + 3.5) + '" class="tx">hari ini, belum pulang</text>';
        } else {
          var xe = X(it.pul);
          s += '<rect x="' + f1(xm) + '" y="' + (cy - 5) + '" width="' + f1(Math.max(4, xe - xm)) + '" height="10" rx="5" class="f-card s-info" stroke-width="1.5" stroke-dasharray="4 3"/>' +
               '<text x="' + f1((xm + xe) / 2) + '" y="' + (cy + 3.5) + '" text-anchor="middle" class="tx">belum absen pulang</text>';
          ket.push(labelHari(it.r.tanggal) + ' belum absen pulang');
        }
      });
      var legendA = '<div class="gleg">' +
        '<div><span class="gsw b-info"></span>Tepat waktu</div>' +
        '<div><span class="gsw b-late"></span>Terlambat</div>' +
        '<div><span class="gdot b-bad"></span>Pulang cepat</div>' +
        '<div><span class="gsw dash"></span>Belum absen pulang</div></div>';
      var legendB = '<div class="gleg">' +
        '<div><span class="gtick" style="background:var(--g-tl)"></span>Batas masuk</div>' +
        '<div><span class="gtick" style="background:var(--g-ok)"></span>Jam pulang</div>' +
        '<div><span class="gchip">P</span>Pagi</div>' +
        '<div><span class="gchip s">S</span>Siang</div>' +
        (adaPenuh ? '<div><span class="gchip">F</span>Penuh</div>' : '') + '</div>';
      return '<div class="gcard"><h2>Jam masuk dan pulang</h2><p class="gsub">Durasi kerja per hari (' + n + ' hari). Geser ke atas/bawah untuk melihat hari lainnya. Tanda kecil = batas masuk dan jam pulang shift.</p>' +
        '<div class="gscroll" tabindex="0">' +
        '<svg class="gsvg gaxis" aria-hidden="true" viewBox="0 0 318 20">' + sumbu + '</svg>' +
        '<svg class="gsvg gbody" role="img" aria-label="Grafik jam masuk dan pulang per hari. ' + (ket.length ? esc(ket.join(', ')) : 'Semua hari lengkap') + '" viewBox="0 20 318 ' + (axisY + 8 - 20) + '">' + s + '</svg>' +
        '</div>' + legendA + legendB + '</div>';
    }

    // ---- Perbandingan dengan 2 bulan sebelumnya (diambil dari simpanan HP dulu, sisanya dari server pelan-pelan) ----
    function muatPerbandingan(bulan) {
      var seq = reqSeq, data = {};
      var daftar = [bulanGeser(bulan, -2), bulanGeser(bulan, -1)];
      data[bulan] = lastResult;
      daftar.forEach(function (b) { var c = bacaCache(b); if (c && c.ok !== false && c.ringkasan) data[b] = c; });
      function gambar() { if (seq === reqSeq) renderBanding(bulan, data); }
      gambar();
      var perlu = daftar.filter(function (b) { return !data[b]; });
      (function berikut() {
        if (!perlu.length || seq !== reqSeq) return;
        var b = perlu.shift();
        google.script.run
          .withSuccessHandler(function (res) { if (res && res.ok) { simpanCache(b, res); data[b] = res; gambar(); } berikut(); })
          .withFailureHandler(function () { berikut(); })
          .getRiwayatAbsen(kode, deviceId, b);
      })();
    }
    function renderBanding(bulan, data) {
      var card = document.getElementById('cardBanding');
      if (!card) return;
      var daftar = [bulanGeser(bulan, -2), bulanGeser(bulan, -1), bulan].filter(function (b) {
        var d = data[b], r = d && d.ringkasan;
        if (!r) return false;
        var tot = r.hadir + r.izin + r.alpa;
        return b === bulan ? tot > 0 : tot >= 3; // bulan lain yang baru 1-2 hari datanya tidak ikut dibandingkan
      });
      if (daftar.length < 2) { card.style.display = 'none'; return; }
      var bulanIni = ymd(new Date()).slice(0, 7);
      var html = daftar.map(function (b) {
        var r = data[b].ringkasan, pct = Math.round(r.hadir / (r.hadir + r.izin + r.alpa) * 100);
        var nm = MONTH_NAMES_ID[parseInt(b.slice(5), 10) - 1] + (b === bulanIni ? ' (berjalan)' : '');
        return '<div class="gb-row"><div class="gb-lbl">' + nm + '</div><div class="gb-track"><div class="gb-fill" style="width:' + pct + '%"></div></div><div class="gb-val">' + pct + '%</div></div>';
      }).join('');
      card.innerHTML = '<h2>Perbandingan bulan</h2><p class="gsub">Persentase hadir</p><div class="gbanding">' + html + '</div>';
      card.style.display = '';
    }
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script>try{if(localStorage.getItem('absensi_admin_ok')==='1')document.getElementById('navAdminLink').style.display='';}catch(e){}</script>
<script>
// Ruang bawah daftar = tinggi menu bawah yang SEBENARNYA + tinggi layar yang benar-benar terlihat,
// supaya tombol/baris terakhir tidak tertutup menu bawah.
(function () {
  var nav = document.querySelector('.bnav'), sa = document.getElementById('scrollArea');
  var root = document.documentElement;
  if (!nav || !sa) return;
  function atur() {
    var tinggiNav = Math.ceil(nav.getBoundingClientRect().height) + 10;
    root.style.setProperty('--navh', tinggiNav + 'px');
    var layar = window.innerHeight || document.documentElement.clientHeight;
    if (layar > 200) root.style.setProperty('--appH', layar + 'px');
    sa.style.setProperty('padding-bottom', 'calc(' + (tinggiNav + 28) + 'px + env(safe-area-inset-bottom, 0px))', 'important');
  }
  atur();
  if (window.ResizeObserver) new ResizeObserver(atur).observe(nav);
  window.addEventListener('resize', atur);
  window.addEventListener('orientationchange', function () { setTimeout(atur, 300); });
  window.addEventListener('load', atur);
  setTimeout(atur, 600);
})();
</script>
