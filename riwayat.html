<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Absensi Guru">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="ikon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg1: #c7d2fe;
      --bg2: #fbcfe8;
      --bg3: #bbf7d0;
      --bg4: #fde68a;
      --bg5: #a5f3fc;
      --glass-bg: rgba(255,255,255,0.20);
      --glass-border: rgba(255,255,255,0.62);
      --glass-shadow: rgba(31,38,135,0.16);
      --modal-bg: rgba(255,255,255,0.82);
      --modal-text-sub: rgba(20,20,24,0.82);
      --modal-glow: 0 1px 4px rgba(255,255,255,0.85);
      --text-main: #1c1c1e;
      --text-sub: rgba(28,28,30,0.55);
      --text-sub-2: rgba(28,28,30,0.45);
      --accent-blue: #0a84ff;
      --accent-blue-2: #5e5ce6;
      --divider: rgba(60,60,67,0.10);
      --input-bg: rgba(118,118,128,0.08);
      --hadir: #248a3d;
      --terlambat: #d70015;
      --izin: #3f5dab;
      --alpa: #a4161a;
      --track-bg: rgba(118,118,128,0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #2e1065;
        --bg2: #500724;
        --bg3: #052e2b;
        --bg4: #422006;
        --bg5: #082f49;
        --glass-bg: rgba(30,30,38,0.30);
        --glass-border: rgba(255,255,255,0.18);
        --glass-shadow: rgba(0,0,0,0.45);
        --modal-bg: rgba(32,32,38,0.85);
        --modal-text-sub: rgba(245,245,250,0.85);
        --modal-glow: 0 1px 4px rgba(0,0,0,0.75);
        --text-main: #f2f2f7;
        --text-sub: rgba(242,242,247,0.6);
        --text-sub-2: rgba(242,242,247,0.42);
        --divider: rgba(255,255,255,0.10);
        --input-bg: rgba(118,118,128,0.24);
        --hadir: #30d158;
        --terlambat: #ff453a;
        --izin: #64d2ff;
        --alpa: #ff6961;
        --track-bg: rgba(118,118,128,0.24);
      }
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, var(--bg1) 0%, transparent 42%),
        radial-gradient(circle at 88% 15%, var(--bg2) 0%, transparent 48%),
        radial-gradient(circle at 30% 95%, var(--bg3) 0%, transparent 50%),
        radial-gradient(circle at 82% 90%, var(--bg4) 0%, transparent 45%),
        radial-gradient(circle at 55% 45%, var(--bg5) 0%, transparent 55%),
        #f2f3f7;
      background-attachment: fixed;
      background-size: 130% 130%;
      animation: bgDrift 22s ease-in-out infinite alternate;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes bgDrift {
      0%   { background-position: 0% 0%, 100% 0%, 20% 100%, 100% 100%, 50% 50%; }
      100% { background-position: 10% 15%, 85% 20%, 35% 85%, 80% 80%, 60% 40%; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
    body.is-scrolling { animation-play-state: paused; }
    body.is-scrolling .summary-card::before { animation-play-state: paused; }
    @media (prefers-color-scheme: dark) { body { background-color: #0b0b0f; } }

    /* ===== Kerangka halaman: header (topbar + judul + ringkasan)
       diam di atas, hanya daftar kartu per-hari yang bisa discroll ===== */
    .page-shell {
      max-width: 1100px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .sticky-top {
      flex: 0 0 auto;
      padding: 20px 20px 0;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(200%) contrast(112%) brightness(1.05);
      -webkit-backdrop-filter: blur(24px) saturate(200%) contrast(112%) brightness(1.05);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 8px 20px var(--glass-shadow);
      position: relative;
      z-index: 5;
    }
    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 20px 56px;
    }

    /* ===== Top bar ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .back-link {
      display: flex; align-items: center; gap: 6px;
      color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 13px;
      padding: 7px 12px 7px 8px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(210%) contrast(112%) brightness(1.06);
      -webkit-backdrop-filter: blur(24px) saturate(210%) contrast(112%) brightness(1.06);
      border: 1px solid var(--glass-border);
      box-shadow: 0 2px 10px var(--glass-shadow);
    }
    .back-link svg { width: 16px; height: 16px; }
    h1 {
      font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-blue-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .month-picker {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(210%) contrast(112%) brightness(1.06);
      -webkit-backdrop-filter: blur(24px) saturate(210%) contrast(112%) brightness(1.06);
      border-radius: 14px;
      padding: 10px 15px;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--text-main);
      box-shadow: 0 2px 10px var(--glass-shadow);
      cursor: pointer;
      border: 1px solid var(--glass-border);
    }
    .month-picker svg { width: 16px; height: 16px; color: var(--accent-blue); }
    .month-picker input[type="month"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none;
    }

    .guru-row {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-sub);
      font-size: 13.5px;
      margin-bottom: 20px;
    }
    .guru-row svg { width: 16px; height: 16px; }
    .guru-row b { color: var(--text-main); font-weight: 700; }

    /* ===== Ringkasan cards ===== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
      transition: gap 0.25s ease, margin-bottom 0.25s ease;
    }
    .summary-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(190%) contrast(110%);
      -webkit-backdrop-filter: blur(24px) saturate(190%) contrast(110%);
      border-radius: 18px;
      padding: 16px 10px;
      transition: border-radius 0.25s ease, padding 0.25s ease, transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.35);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .summary-card:active { transform: scale(0.96); }
    .summary-card.active {
      border-color: currentColor;
      box-shadow: 0 8px 24px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.35), 0 0 0 2px currentColor;
    }
    .summary-card.hadir.active { color: var(--hadir); }
    .summary-card.terlambat.active { color: var(--terlambat); }
    .summary-card.izin.active { color: var(--izin); }
    .summary-card.alpa.active { color: var(--alpa); }
    .summary-card::before {
      content: "";
      position: absolute;
      top: -60%; left: -70%;
      width: 55%; height: 220%;
      background: linear-gradient(115deg,
        transparent 0%,
        rgba(255,255,255,0.05) 35%,
        rgba(255,255,255,0.50) 48%,
        rgba(255,255,255,0.10) 60%,
        transparent 100%);
      transform: rotate(6deg);
      pointer-events: none;
      animation: glassSheen 7s ease-in-out infinite;
      mix-blend-mode: overlay;
    }
    .summary-card::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.70) 0%,
        rgba(255,255,255,0.05) 25%,
        rgba(255,255,255,0) 65%,
        rgba(255,255,255,0.25) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes glassSheen {
      0%, 100% { left: -70%; }
      50% { left: 115%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .summary-card::before { animation: none; }
    }
    .summary-card .num { font-size: 27px; font-weight: 800; line-height: 1.2; transition: font-size 0.25s ease; }
    .summary-card .lbl {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-sub-2); margin-top: 2px;
      transition: font-size 0.25s ease, margin-top 0.25s ease, letter-spacing 0.25s ease;
    }
    /* ==== Mode ringkas: aktif otomatis lewat JS saat daftar kartu di-scroll ==== */
    .summary-grid.compact { gap: 8px; margin-bottom: 14px; }
    .summary-grid.compact .summary-card { border-radius: 14px; padding: 10px 4px; }
    .summary-grid.compact .summary-card .num { font-size: 19px; }
    .summary-grid.compact .summary-card .lbl { font-size: 8.5px; letter-spacing: 0.03em; margin-top: 1px; }
    .summary-card.hadir .num { color: var(--hadir); }
    .summary-card.terlambat .num { color: var(--terlambat); }
    .summary-card.izin .num { color: var(--izin); }
    .summary-card.alpa .num { color: var(--alpa); }

    /* ===== Panel detail (desktop: tabel) ===== */
    .panel {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(220%) contrast(115%) brightness(1.08);
      -webkit-backdrop-filter: blur(28px) saturate(220%) contrast(115%) brightness(1.08);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px var(--glass-shadow);
      overflow: hidden;
    }
    .panel::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.60) 0%,
        rgba(255,255,255,0.05) 20%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.20) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .panel-title { padding: 18px 20px 4px; font-weight: 700; font-size: 15px; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    thead th {
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-sub-2);
      padding: 10px 20px;
      border-bottom: 1px solid var(--divider);
    }
    tbody td {
      padding: 14px 20px;
      font-size: 13.5px;
      border-bottom: 1px solid var(--divider);
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(10,132,255,0.05); }
    tbody tr:last-child td { border-bottom: none; }
    .cell-jam { display: flex; align-items: center; gap: 6px; }
    .cell-jam svg { width: 14px; height: 14px; flex-shrink: 0; }
    .cell-jam.telat { color: var(--terlambat); font-weight: 700; }
    .cell-note { color: var(--text-sub); font-style: italic; white-space: normal; }
    .dash { color: var(--text-sub-2); }

    .badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.ok { background: rgba(48,209,88,0.16); color: var(--hadir); }
    .badge.late { background: rgba(255,69,58,0.14); color: var(--terlambat); }
    .badge.izin { background: rgba(94,92,230,0.14); color: var(--izin); }
    .badge.alpa { background: rgba(255,69,58,0.16); color: var(--alpa); }
    .tag-daring { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px;
                  font-size: 11px; font-weight: 700; background: rgba(255,159,10,0.16); color: #b96400; }
    @media (prefers-color-scheme: dark) { .tag-daring { color: #ff9f0a; } }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub-2);
      font-size: 13.5px;
    }

    /* ===== Mobile cards (hidden by default, shown under 768px) ===== */
    .mobile-list { display: none; }
    .day-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(170%) contrast(108%);
      -webkit-backdrop-filter: blur(18px) saturate(170%) contrast(108%);
      border-radius: 18px;
      padding: 16px 16px 14px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 20px var(--glass-shadow);
      margin-bottom: 14px;
      overflow: hidden;
      content-visibility: auto;
      contain-intrinsic-size: 0 150px;
    }
    .day-card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; gap: 8px;
    }
    .day-card-date { font-weight: 700; font-size: 15px; }
    .day-card-meta {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-sub);
      margin-bottom: 3px;
    }
    .day-card-meta svg { width: 13px; height: 13px; flex-shrink: 0; }
    .jam-box {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: var(--track-bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px;
    }
    .jam-box div { text-align: center; }
    .jam-box .jl { font-size: 11px; color: var(--text-sub-2); margin-bottom: 2px; }
    .jam-box .jv { font-size: 16px; font-weight: 700; }
    .jam-box .jv.telat { color: var(--terlambat); }
    .note-box {
      background: var(--track-bg); border-radius: 12px; padding: 14px 12px; margin-top: 10px;
      text-align: center; font-size: 13.5px; color: var(--text-main); opacity: 0.85;
    }

    .loading {
      padding: 40px 20px; text-align: center; color: var(--text-sub); font-size: 13.5px;
    }

    @media (max-width: 768px) {
      .sticky-top { padding: 14px 14px 0; }
      .scroll-area { padding: 14px 14px 20px; }
      .panel { display: none; }
      .mobile-list { display: block; }
      h1 { font-size: 19px; }
      .topbar { align-items: flex-start; }
      .topbar-left { flex-direction: column; align-items: flex-start; gap: 10px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .summary-grid.compact { grid-template-columns: repeat(4, 1fr); }
    }

    /* ================= MODAL POPUP (error) ================= */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 30, 0.35);
      backdrop-filter: blur(10px) saturate(190%) contrast(110%) brightness(1.05);
      -webkit-backdrop-filter: blur(10px) saturate(190%) contrast(110%) brightness(1.05);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: var(--modal-bg);
      backdrop-filter: blur(34px) saturate(180%) contrast(105%);
      -webkit-backdrop-filter: blur(34px) saturate(180%) contrast(105%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 32px 28px 28px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -18px rgba(20,20,40,0.35);
      animation: modalPop 0.18s ease-out;
    }
    @keyframes modalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      background: rgba(255,69,58,0.16); color: var(--terlambat);
    }
    .modal-icon svg { width: 30px; height: 30px; }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--text-main); margin: 0 0 8px; text-shadow: var(--modal-glow); }
    .modal-desc { font-size: 13.5px; font-weight: 600; color: var(--modal-text-sub); line-height: 1.5; margin: 0 0 24px; text-shadow: var(--modal-glow); }
    .modal-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-2));
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 6px 18px rgba(10,132,255,0.35);
    }
    .modal-btn svg { width: 16px; height: 16px; }
      /* ===== Footer kaca (tetap di bawah layar) ===== */
    .glass-footer {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 50;
      padding: 7px 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: rgba(29,29,31,0.65);
      background: rgba(255,255,255,0.35);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 999px;
      box-shadow: 0 8px 24px -10px rgba(50,70,90,0.35),
                  inset 0 1px 0 rgba(255,255,255,0.6);
      pointer-events: none;
    }
    .glass-footer strong { color: rgba(29,29,31,0.85); font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .glass-footer {
        color: rgba(242,242,247,0.65);
        background: rgba(30,30,38,0.35);
        border-color: rgba(255,255,255,0.16);
        box-shadow: 0 8px 24px -10px rgba(0,0,0,0.6),
                    inset 0 1px 0 rgba(255,255,255,0.10);
      }
      .glass-footer strong { color: rgba(242,242,247,0.9); }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="sticky-top">
      <div class="topbar">
        <div class="topbar-left">
          <a class="back-link" id="backLink" href="#" target="_top">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Kembali ke Halaman Absensi
          </a>
          <h1>Riwayat Absensi</h1>
        </div>
        <div class="month-picker" id="monthPicker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="monthLabel">-</span>
          <input type="month" id="monthInput">
        </div>
      </div>

      <div class="guru-row" id="guruRow" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
        Guru Pengajar: <b id="guruNama">-</b>
      </div>

      <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <div class="scroll-area" id="scrollArea">
      <div id="content">
        <div class="loading">Memuat riwayat absensi...</div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL POPUP: error ================= -->
  <div id="errorOverlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </div>
      <h3 class="modal-title" id="errorTitle">Tidak Bisa Menampilkan Riwayat</h3>
      <p class="modal-desc" id="errorDesc"></p>
      <a class="modal-btn" id="errorBtn" href="#" target="_top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Kembali ke Halaman Absensi
      </a>
    </div>
  </div>

  <script>
    var WEBAPP_URL = "index.html";
    var MONTH_NAMES_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    function formatMonthLabel(yyyyMM) {
      var parts = yyyyMM.split("-");
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      return MONTH_NAMES_ID[m - 1] + " " + y;
    }

    function formatTanggalPanjang(isoDate) {
      var d = new Date(isoDate + "T00:00:00");
      var hariNama = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][d.getDay()];
      var bulanNama = MONTH_NAMES_ID[d.getMonth()];
      return { full: hariNama + ", " + d.getDate() + " " + bulanNama + " " + d.getFullYear(),
               short: hariNama + ", " + d.getDate() + " " + bulanNama.substring(0,3) };
    }

    function formatTelat(menitDesimal) {
      if (!menitDesimal || menitDesimal <= 0) return "-";
      var menit = Math.floor(menitDesimal);
      var detik = Math.round((menitDesimal - menit) * 60);
      if (detik === 60) { menit += 1; detik = 0; }
      return menit + " menit " + (detik < 10 ? "0" + detik : detik) + " detik";
    }

    var KET_LABEL = { S: "Sakit", I: "Izin", A: "Alpa", DL: "Dinas Luar", C: "Cuti Melahirkan" };

    function formatShift(shift) {
      if (!shift) return null;
      return shift === 'P' ? 'Pagi' : shift === 'S' ? 'Siang' : 'Penuh';
    }

    // Label kecil "Daring" ditempel di sebelah Shift, HANYA untuk hari yang
    // absennya lewat mode daring (lihat row.daring dari getRiwayatAbsen).
    // Bukan badge Status -- tidak menggantikan Tepat Waktu/Terlambat.
    function daringTag(row) {
      return row.daring ? '<span class="tag-daring">Daring</span>' : '';
    }

    var kode, deviceId, bulanAwal; // diisi lewat google.script.url.getLocation() di bawah

    document.getElementById('backLink').href = WEBAPP_URL;

    // PENTING: di dalam sandbox iframe Apps Script, window.location.search TIDAK
    // bisa diandalkan untuk baca parameter URL (?kode=...&dev=...). Harus pakai
    // API resmi google.script.url.getLocation() supaya dapat parameter yang benar.
    google.script.url.getLocation(function (location) {
      kode = location.parameter.kode;
      deviceId = location.parameter.dev;
      bulanAwal = location.parameter.bulan; // opsional, format yyyy-MM
      init();
    });

    function init() {
      var now = new Date();
      var defaultBulan = bulanAwal || (now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, '0'));
      document.getElementById('monthInput').value = defaultBulan;
      document.getElementById('monthLabel').textContent = formatMonthLabel(defaultBulan);

      document.getElementById('monthInput').addEventListener('change', function (e) {
        document.getElementById('monthLabel').textContent = formatMonthLabel(e.target.value);
        loadData(e.target.value);
      });

      if (!kode) {
        renderError('Nama guru tidak diketahui. Kembali ke halaman absen dan pilih nama terlebih dahulu.');
        return;
      }
      loadData(defaultBulan);
    }

    function loadData(bulanTahun) {
      document.getElementById('content').innerHTML = '<div class="loading">Memuat riwayat absensi...</div>';
      google.script.run
        .withSuccessHandler(function (result) {
          if (!result.ok) { renderError(result.message); return; }
          if (result.nama) {
            document.getElementById('guruNama').textContent = result.nama;
            document.getElementById('guruRow').style.display = 'flex';
          }
          renderData(result);
        })
        .withFailureHandler(function (err) {
          renderError('Terjadi kesalahan: ' + err.message);
        })
        .getRiwayatAbsen(kode, deviceId, bulanTahun);
    }

    function renderError(msg) {
      lastRows = [];
      activeFilter = null;
      document.getElementById('summaryGrid').innerHTML = '';
      document.getElementById('content').innerHTML = '';
      document.getElementById('errorDesc').textContent = msg;
      document.getElementById('errorBtn').href = WEBAPP_URL;
      document.getElementById('errorOverlay').classList.add('show');
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function statusBadge(row) {
      if (row.ket) {
        var cls = row.ket === 'A' ? 'alpa' : 'izin';
        var label = KET_LABEL[row.ket] || row.ket;
        return '<span class="badge ' + cls + '">' + label + '</span>';
      }
      if (row.status === 'Terlambat' || row.status === 'Sangat Terlambat') {
        return '<span class="badge late">Terlambat (' + escapeHtml(row.status === 'Sangat Terlambat' ? 'Sangat Terlambat' : formatTelatSingkat(row.telatMenit)) + ')</span>';
      }
      if (row.status === 'Tepat Waktu') {
        return '<span class="badge ok">Tepat Waktu</span>';
      }
      return '<span class="badge alpa">Tanpa Data</span>';
    }

    function formatTelatSingkat(menitDesimal) {
      if (!menitDesimal || menitDesimal <= 0) return "00:00:00";
      var menit = Math.floor(menitDesimal);
      var detik = Math.round((menitDesimal - menit) * 60);
      var jam = Math.floor(menit / 60);
      var sisaMenit = menit % 60;
      return String(jam).padStart(2,'0') + ':' + String(sisaMenit).padStart(2,'0') + ':' + String(detik).padStart(2,'0');
    }

    // ==== Kotak ringkasan mengecil otomatis saat daftar kartu di-scroll ====
    // (sekalian jeda animasi latar belakang selama scroll aktif, supaya
    //  browser tidak menghitung ulang blur kaca tiap frame saat scroll --
    //  ini yang bikin terasa lemot terutama kalau riwayatnya panjang)
    (function () {
      var scrollArea = document.getElementById('scrollArea');
      var lastState = false;
      var scrollTimer = null;
      scrollArea.addEventListener('scroll', function () {
        var isScrolled = scrollArea.scrollTop > 8;
        if (isScrolled !== lastState) {
          lastState = isScrolled;
          var grid = document.getElementById('summaryGrid');
          if (grid) grid.classList.toggle('compact', isScrolled);
        }
        document.body.classList.add('is-scrolling');
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
          document.body.classList.remove('is-scrolling');
        }, 200);
      }, { passive: true });
    })();

    var lastRows = [];
    var activeFilter = null; // null = tampilkan semua

    function rowCategory(row) {
      if (row.ket) return (row.ket === 'A') ? 'alpa' : 'izin';
      if (row.status === 'Terlambat' || row.status === 'Sangat Terlambat') return 'terlambat';
      if (row.status === 'Tepat Waktu') return 'hadir';
      if (row.jamMasuk || row.jamKeluar) return 'hadir';
      return 'alpa';
    }
    function rowMatchesFilter(row, filterKey) {
      if (!filterKey) return true;
      var cat = rowCategory(row);
      if (filterKey === 'hadir') return cat === 'hadir' || cat === 'terlambat';
      return cat === filterKey;
    }
    var FILTER_EMPTY_TEXT = {
      hadir: 'Tidak ada hari hadir untuk bulan ini.',
      terlambat: 'Tidak ada catatan terlambat bulan ini \u2014 mantap!',
      izin: 'Tidak ada izin tercatat bulan ini.',
      alpa: 'Tidak ada alpa tercatat bulan ini \u2014 mantap!'
    };

    function renderData(result) {
      var r = result.ringkasan;
      lastRows = result.rows;
      activeFilter = null;

      var summaryHtml = '';
      summaryHtml += summaryCard('hadir', r.hadir, 'Hadir');
      summaryHtml += summaryCard('terlambat', r.terlambat, 'Terlambat');
      summaryHtml += summaryCard('izin', r.izin, 'Izin');
      summaryHtml += summaryCard('alpa', r.alpa, 'Alpa');
      document.getElementById('summaryGrid').innerHTML = summaryHtml;

      renderList();
    }

    function renderList() {
      var allRows = lastRows;
      var rows = activeFilter ? allRows.filter(function (row) { return rowMatchesFilter(row, activeFilter); }) : allRows;

      // Tandai kotak ringkasan yang sedang aktif sebagai filter
      document.querySelectorAll('.summary-card').forEach(function (card) {
        card.classList.toggle('active', activeFilter && card.classList.contains(activeFilter));
      });

      var html = '';

      if (allRows.length === 0) {
        html += '<div class="panel"><div class="empty-state">Belum ada data absensi untuk bulan ini.</div></div>';
        html += '<div class="mobile-list"><div class="day-card"><div class="empty-state" style="padding:20px 0;">Belum ada data absensi untuk bulan ini.</div></div></div>';
        document.getElementById('content').innerHTML = html;
        return;
      }

      if (rows.length === 0) {
        var emptyMsg = FILTER_EMPTY_TEXT[activeFilter] || 'Tidak ada data untuk filter ini.';
        html += '<div class="panel"><div class="empty-state">' + emptyMsg + '</div></div>';
        html += '<div class="mobile-list"><div class="day-card"><div class="empty-state" style="padding:20px 0;">' + emptyMsg + '</div></div></div>';
        document.getElementById('content').innerHTML = html;
        return;
      }

      // ---- Desktop: tabel ----
      html += '<div class="panel">';
      html += '<div class="panel-title">Detail Kehadiran Bulan Ini</div>';
      html += '<table><thead><tr>' +
        '<th>Tanggal</th><th>Shift</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Keterlambatan</th>' +
        '</tr></thead><tbody>';

      rows.forEach(function (row) {
        var tgl = formatTanggalPanjang(row.tanggal);
        var shiftLabel = formatShift(row.shift);
        html += '<tr>';
        html += '<td>' + tgl.full + '</td>';
        html += '<td>' + (shiftLabel || '<span class="dash">-</span>') + daringTag(row) + '</td>';
        if (row.ket) {
          html += '<td colspan="2" class="cell-note">' + (KET_LABEL[row.ket] || row.ket) + '</td>';
          html += '<td><span class="dash">-</span></td>';
          html += '<td>' + statusBadge(row) + '</td>';
        } else {
          html += '<td><div class="cell-jam' + (row.status && row.status.indexOf('Terlambat') !== -1 ? ' telat' : '') + '">' + (row.jamMasuk || '<span class="dash">-</span>') + '</div></td>';
          html += '<td><div class="cell-jam">' + (row.jamKeluar || '<span class="dash">-</span>') + '</div></td>';
          html += '<td>' + statusBadge(row) + '</td>';
          html += '<td>' + formatTelat(row.telatMenit) + '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';

      // ---- Mobile: kartu ----
      html += '<div class="mobile-list">';
      rows.forEach(function (row) {
        var tgl = formatTanggalPanjang(row.tanggal);
        var shiftLabel = formatShift(row.shift);
        html += '<div class="day-card">';
        html += '<div class="day-card-top"><div class="day-card-date">' + tgl.short + '</div>' + statusBadge(row) + '</div>';
        if (row.ket) {
          html += '<div class="day-card-meta">' + iconFile() + ' Surat/Keterangan Admin</div>';
          html += '<div class="note-box">' + (KET_LABEL[row.ket] || row.ket) + '</div>';
        } else {
          if (shiftLabel) html += '<div class="day-card-meta">' + iconClock() + ' Shift: ' + shiftLabel + daringTag(row) + '</div>';
          html += '<div class="jam-box">';
          html += '<div><div class="jl">Masuk</div><div class="jv' + (row.status && row.status.indexOf('Terlambat') !== -1 ? ' telat' : '') + '">' + (row.jamMasuk || '-') + '</div></div>';
          html += '<div><div class="jl">Pulang</div><div class="jv">' + (row.jamKeluar || '-') + '</div></div>';
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';

      document.getElementById('content').innerHTML = html;
    }

    // Klik kotak ringkasan = filter daftar riwayat menurut kategori itu.
    // Klik lagi kotak yang sama = kembali menampilkan semua.
    document.getElementById('summaryGrid').addEventListener('click', function (e) {
      var card = e.target.closest('.summary-card');
      if (!card) return;
      var key = ['hadir', 'terlambat', 'izin', 'alpa'].filter(function (k) { return card.classList.contains(k); })[0];
      if (!key) return;
      activeFilter = (activeFilter === key) ? null : key;
      renderList();
    });

    function summaryCard(cls, num, label) {
      return '<div class="summary-card ' + cls + '" role="button" tabindex="0"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
    }
    function iconClock() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'; }
    function iconFile() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>'; }
  </script>
<div class="glass-footer">Di Kembangkan Oleh : <strong>Ade Irwansyah</strong></div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
